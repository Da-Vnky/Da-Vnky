<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" id="bedroom" preserveAspectRatio="xMidYMid meet" font-family="'IBM VGA', monospace">
<defs>
  <linearGradient id="b-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0a14"/><stop offset=".55" stop-color="#191526"/><stop offset="1" stop-color="#211b2a"/></linearGradient>
  <linearGradient id="b-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2232"/><stop offset="1" stop-color="#110d16"/></linearGradient>
  <linearGradient id="b-beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb8ff" stop-opacity=".18"/><stop offset="1" stop-color="#9fb8ff" stop-opacity="0"/></linearGradient>
  <radialGradient id="b-green"><stop offset="0" stop-color="#5dffa0" stop-opacity=".45"/><stop offset=".4" stop-color="#2bd97a" stop-opacity=".12"/><stop offset="1" stop-color="#2bd97a" stop-opacity="0"/></radialGradient>
  <radialGradient id="b-purple"><stop offset="0" stop-color="#d06cff" stop-opacity=".5"/><stop offset=".4" stop-color="#a04cff" stop-opacity=".15"/><stop offset="1" stop-color="#a04cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="b-red"><stop offset="0" stop-color="#ff3b2a" stop-opacity=".45"/><stop offset="1" stop-color="#ff3b2a" stop-opacity="0"/></radialGradient>
  <radialGradient id="b-blue"><stop offset="0" stop-color="#8ab8ff" stop-opacity=".35"/><stop offset="1" stop-color="#8ab8ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="b-moon"><stop offset="0" stop-color="#b8ccff" stop-opacity=".3"/><stop offset="1" stop-color="#b8ccff" stop-opacity="0"/></radialGradient>
  <radialGradient id="b-vignette" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient>
  <pattern id="b-paper" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M18 4 l6 14 l-6 14 l-6 -14z" fill="#fff" fill-opacity=".018"/></pattern>
  <pattern id="b-carpet" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="none"/><circle cx="1" cy="2" r=".7" fill="#fff" fill-opacity=".04"/><circle cx="4" cy="5" r=".6" fill="#000" fill-opacity=".2"/></pattern>
  <filter id="b-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="b-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>

