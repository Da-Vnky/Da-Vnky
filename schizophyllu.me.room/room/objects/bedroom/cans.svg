<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM VGA', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- cans (bedroom): the energy drink cans round DaV-nky (silver and blue, no label)
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes.
     (added for DaV-nky) -->
<defs>
  <g id="dv-can">
    <rect x="0" y="0" width="12" height="26" rx="2" fill="#2e4f94"/>
    <rect x="0" y="0" width="12" height="11" rx="2" fill="#a9aeb8"/>
    <path d="M0 11 L12 7 L12 11 Z" fill="#2e4f94"/>
    <rect x="0" y="0" width="12" height="3" fill="#888"/>
    <path d="M3 16 h6" stroke="#c94a3a" stroke-width="1.6"/>
  </g>
</defs>
  <!-- by the pillow, still standing -->
  <use href="#dv-can" x="1540" y="590"/>
  <!-- on its side by his chest -->
  <use href="#dv-can" transform="translate(1418 628) rotate(-90)"/>
  <!-- on the nightstand, by the lava lamp -->
  <use href="#dv-can" x="1128" y="614"/>
  <!-- the one his hand let go of, rolled out in front of the box -->
  <use href="#dv-can" transform="translate(1486 790) rotate(-84)"/>
  <!-- on the floor, along the bed -->
  <use href="#dv-can" x="1206" y="774"/>
  <use href="#dv-can" transform="translate(1238 802) rotate(-96)"/>
  <use href="#dv-can" x="1326" y="776"/>
  <!-- this one's been crushed -->
  <g transform="translate(1356 790)">
    <path d="M0 4 L12 0 L13 6 L9 9 L13 13 L0 14 L2 9 Z" fill="#2e4f94"/>
    <path d="M0 4 L12 0 L12.6 3 L0.6 7 Z" fill="#a9aeb8"/>
  </g>
</svg>
