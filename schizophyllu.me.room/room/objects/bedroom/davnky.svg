<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM VGA', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- davnky (bedroom): DaV-nky, from across the street. passed out face down on skizy's bed, legs under the blanket formation
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes.
     (added for DaV-nky. the class "breathe" makes him rise and fall, "zzz" floats; "dv-head", "dv-eyes" and "dv-shut"
     are for when he's clicked: he lifts his head, mumbles, and goes back down. DaV-nky's sky/css/skizy-room.css) -->
  <!-- the arm hanging off the edge of the bed -->
  <path d="M1452 626 Q1446 660 1452 690 Q1456 702 1462 706 L1474 702 Q1468 684 1470 656 Q1472 636 1468 624Z" fill="#1c1a20"/>
  <path d="M1452 700 q4 12 14 14 q8 -2 8 -10 q-4 -6 -10 -8z" fill="#c9a88e"/>
  <path d="M1458 712 l-2 6 M1464 714 l-1 6 M1470 712 l0 5" stroke="#b08f76" stroke-width="2" stroke-linecap="round"/>
  <g class="breathe">
    <!-- hoodie: on his front along the bed, into the blanket formation -->
    <path d="M1370 632 Q1372 606 1398 600 Q1436 590 1472 594 Q1492 598 1494 614 Q1494 630 1480 636 Q1432 642 1384 640Z" fill="#1c1a20"/>
    <path d="M1404 606 Q1436 598 1466 602" stroke="#2a2730" stroke-width="3" fill="none"/>
    <!-- the hood, bunched at his neck -->
    <path d="M1468 596 Q1486 588 1496 600 Q1494 612 1482 614 Q1472 610 1468 596Z" fill="#26232b"/>
    <!-- the laptop's light along his back -->
    <path d="M1384 604 Q1430 590 1470 592" stroke="#9fb8ff" stroke-width="1.5" fill="none" opacity=".4"/>
  </g>
  <g class="dv-head">
    <!-- hair, dark and wavy, spilling over the pillow -->
    <path d="M1488 604 Q1478 576 1496 562 Q1514 552 1532 560 Q1550 570 1550 590 Q1556 604 1566 612 Q1552 618 1544 610 Q1548 624 1536 628 Q1528 618 1522 612 Z" fill="#2a1c14"/>
    <!-- face, cheek on the pillow, turned to the room -->
    <path d="M1490 600 Q1490 578 1508 574 Q1526 572 1532 590 Q1536 606 1526 618 Q1514 626 1500 620 Q1490 614 1490 600Z" fill="#c9a88e"/>
    <!-- beard -->
    <path d="M1490 600 Q1492 616 1502 622 Q1516 628 1528 618 Q1532 610 1530 602 Q1522 612 1512 610 Q1500 610 1494 598Z" fill="#2a1c14"/>
    <path d="M1504 607 q6 -3 12 0" stroke="#2a1c14" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- mouth, a little open -->
    <ellipse cx="1510" cy="612" rx="3.2" ry="2.2" fill="#3a1e1a"/>
    <!-- eyes shut (and, when he stirs, half open) -->
    <g class="dv-shut" stroke="#3a2a22" stroke-width="1.8" fill="none" stroke-linecap="round">
      <path d="M1500 592 q4 3 8 0"/><path d="M1516 590 q4 3 8 0"/>
    </g>
    <g class="dv-eyes" fill="#2a1c14">
      <path d="M1500 591 h8 v2.4 h-8z"/><path d="M1516 589 h8 v2.4 h-8z"/>
    </g>
    <path d="M1498 586 q5 -3 10 -1 M1514 584 q5 -3 10 -1" stroke="#2a1c14" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- the bit of hair that always falls across -->
    <path d="M1494 580 Q1502 570 1514 576 Q1504 578 1500 590 Z" fill="#2a1c14"/>
    <path d="M1492 572 Q1508 556 1530 562" stroke="#9fb8ff" stroke-width="1.2" fill="none" opacity=".3"/>
  </g>
  <g class="zzz" fill="#cfd8d2" font-size="12">
    <text x="1484" y="560">z</text><text x="1474" y="546" font-size="10">z</text><text x="1466" y="534" font-size="8">z</text>
  </g>
</svg>
