<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- glow-lavalamp (bedroom): the lava lamp's purple glow. a glow on its own: paint it however you like.
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes; the room blends it
     in "screen" mode (light only adds). not clickable.
     the code looks these ids up, so keep them: #lavaglow -->
<!-- the gradient lives in the room file too; this copy is only so the file previews on its own -->
<defs class="preview">
  <radialGradient id="b-purple"><stop offset="0" stop-color="#d06cff" stop-opacity=".5"/><stop offset=".4" stop-color="#a04cff" stop-opacity=".15"/><stop offset="1" stop-color="#a04cff" stop-opacity="0"/></radialGradient>
</defs>
  <ellipse id="lavaglow" cx="1105" cy="590" rx="230" ry="200" fill="url(#b-purple)"/>
</svg>
