    <rect x="912" y="214" width="7" height="476" fill="#ffb86a" opacity=".55"/>
    <rect x="919" y="214" width="117" height="476" fill="#3a2c24"/>
    <rect x="930" y="232" width="94" height="190" fill="none" stroke="#2a1f1a" stroke-width="3"/>
    <rect x="930" y="446" width="94" height="224" fill="none" stroke="#2a1f1a" stroke-width="3"/>
    <circle cx="930" cy="440" r="4" fill="#b8a070"/>
  </g>
</svg>
