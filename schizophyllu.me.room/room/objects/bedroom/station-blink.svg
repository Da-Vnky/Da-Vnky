<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- station-blink (bedroom): the lights on the music station, the parts of station.svg that blink or move. they sit on top of it, so a painted
     (flat) station keeps them. not clickable. drawn in room coordinates (the whole 1600x900 room). -->
  <circle cx="530" cy="542" r="2.4" fill="#6dffb0" class="blink b3"/>
  <circle cx="540" cy="542" r="2.4" fill="#ffb347" class="blink b2"/>
  <g transform="rotate(8 520 612)"><circle cx="544" cy="618" r="2" fill="#ff3b2a" class="blink b1"/></g>
</svg>
