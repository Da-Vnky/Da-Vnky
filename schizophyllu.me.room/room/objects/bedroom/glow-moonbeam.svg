<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- glow-moonbeam (bedroom): the moonlight falling from the window. a glow on its own: paint it however you like.
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes; the room blends it
     in "screen" mode (light only adds). not clickable. -->
<!-- the gradient lives in the room file too; this copy is only so the file previews on its own -->
<defs class="preview">
  <linearGradient id="b-beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb8ff" stop-opacity=".18"/><stop offset="1" stop-color="#9fb8ff" stop-opacity="0"/></linearGradient>
</defs>
  <polygon points="1210,440 1442,440 1566,900 1086,900" fill="url(#b-beam)"/>
</svg>
