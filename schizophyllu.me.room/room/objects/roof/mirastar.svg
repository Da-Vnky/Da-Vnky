<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM VGA', monospace">
<!-- mirastar (roof)
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes. -->
<defs>
  <radialGradient id="r-star"><stop offset="0" stop-color="#ffd8b0" stop-opacity=".9"/><stop offset=".3" stop-color="#ff9a6a" stop-opacity=".3"/><stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/></radialGradient>
</defs>
  <circle cx="1182" cy="184" r="26" fill="#000" opacity="0"/>
  <circle class="mira-glow" cx="1182" cy="184" r="18" fill="url(#r-star)"/>
  <circle class="mira-core" cx="1182" cy="184" r="2.6" fill="#ffe0c0"/>
</svg>
