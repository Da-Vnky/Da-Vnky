<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- rig-blink (roof): the rig lights, the parts of rig.svg that blink or move. they sit on top of it, so a painted
     (flat) rig keeps them. not clickable. drawn in room coordinates (the whole 1600x900 room). -->
  <rect x="1128" y="730" width="4" height="4" fill="#6dffb0" class="blink b1"/>
  <rect x="1136" y="730" width="4" height="4" fill="#6dffb0" class="blink b2"/>
  <rect x="1144" y="730" width="4" height="4" fill="#ffb347" class="blink b3"/>
</svg>
