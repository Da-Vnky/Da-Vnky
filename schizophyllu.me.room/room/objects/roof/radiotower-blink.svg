<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- radiotower-blink (roof): the aircraft light, the parts of radiotower.svg that blink or move. they sit on top of it, so a painted
     (flat) radiotower keeps them. not clickable. drawn in room coordinates (the whole 1600x900 room). -->
<defs>
  <filter id="r-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
  <circle class="blink b1" cx="1452" cy="298" r="3.4" fill="#ff3b2a" filter="url(#r-glow)"/>
  <circle class="blink b2" cx="1452" cy="420" r="2.4" fill="#ff3b2a" filter="url(#r-glow)"/>
</svg>
