<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM VGA', monospace">
<!-- cbulb (closet)
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes.
     the code looks these ids up, so keep them: #c-bulbglass -->
<defs>
  <filter id="c-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
  <rect id="c-chainhit" x="780" y="118" width="44" height="104" fill="#000" opacity="0"/>
  <rect x="793" y="118" width="14" height="12" fill="#3a3a3a"/><circle id="c-bulbglass" cx="800" cy="142" r="13" fill="#ffe6b0" filter="url(#c-glow)"/>
  <path d="M812 130 V214" stroke="#9a9a94" stroke-width="1.4" stroke-dasharray="2 2"/><circle cx="812" cy="216" r="3" fill="#b8a070"/>
</svg>
