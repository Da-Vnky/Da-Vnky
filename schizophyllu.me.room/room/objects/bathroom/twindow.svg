<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM VGA', monospace">
<!-- twindow (bathroom): high frosted window
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes. -->
<defs>
  <linearGradient id="t-frost" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aaebc"/><stop offset="1" stop-color="#5a6a78"/></linearGradient>
</defs>
<!-- shared with other things in the room: these copies are only here so this file previews right.
     the real ones live in the room file's <defs>, and the page ignores these -->
<defs class="preview">
  <filter id="t-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
  <rect x="1296" y="104" width="172" height="124" fill="#3a3f3c"/>
  <rect x="1306" y="114" width="152" height="104" fill="url(#t-frost)"/>
  <rect x="1306" y="114" width="152" height="104" fill="#dfe8ff" opacity=".12" filter="url(#t-soft)"/>
  <path d="M1330 118 l40 50 l-10 30 l30 18" stroke="#2a2f2c" stroke-width="1.4" fill="none"/>
  <g fill="#c8b890" opacity=".85"><rect x="1334" y="150" width="60" height="10" transform="rotate(40 1364 155)"/><rect x="1334" y="150" width="60" height="10" transform="rotate(-40 1364 155)"/></g>
</svg>
