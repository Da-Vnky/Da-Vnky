      <rect x="738" y="212" width="18" height="26" rx="2" fill="#e0782a" opacity=".92"/><rect x="737" y="206" width="20" height="7" rx="2" fill="#f2f2ee"/><rect x="740" y="218" width="14" height="14" fill="#f4f1ea" opacity=".3"/>
      <g transform="rotate(84 769 236)"><rect x="760" y="208" width="18" height="30" rx="2" fill="#e0782a" opacity=".92"/><rect x="759" y="202" width="20" height="7" rx="2" fill="#f2f2ee"/></g>
      <rect x="786" y="204" width="18" height="34" rx="2" fill="#e0782a" opacity=".92"/><rect x="785" y="198" width="20" height="7" rx="2" fill="#f2f2ee"/><rect x="788" y="210" width="14" height="22" fill="#f4f1ea" opacity=".3"/>
