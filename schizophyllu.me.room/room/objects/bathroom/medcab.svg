<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM VGA', monospace">
<!-- medcab (bathroom): sink + mirror cabinet
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes.
     the code looks these ids up, so keep them: #cab-door, #cab-inside, #t-fog -->
<defs>
  <filter id="t-fogblur"><feGaussianBlur stdDeviation="1.2"/></filter>
  <linearGradient id="t-mirror" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9aabae"/><stop offset=".5" stop-color="#5d6c6f"/><stop offset="1" stop-color="#3c4749"/></linearGradient>
</defs>
<!-- shared with other things in the room: these copies are only here so this file previews right.
     the real ones live in the room file's <defs>, and the page ignores these -->
<defs class="preview">
  <filter id="t-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
  <rect x="676" y="154" width="208" height="252" rx="4" fill="#8a8e88"/>
  <g id="cab-inside" style="display:none">
