      <rect x="727.0" y="290" width="13" height="7" fill="#8ac8f0" transform="rotate(-30 727.0 297)"/>
      <rect x="742.5" y="290" width="13" height="7" fill="#8ac8f0" transform="rotate(-30 742.5 297)"/>
