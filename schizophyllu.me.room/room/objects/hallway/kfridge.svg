    <rect x="1470" y="426" width="122" height="6" fill="#a8b8c4"/>
    <g class="obj" data-id="kf-tots">
      <rect x="1482" y="378" width="46" height="44" rx="4" fill="#f2c230"/><text x="1486" y="396" font-size="7" fill="#7a3a10">TATER</text><text x="1486" y="405" font-size="7" fill="#7a3a10">TOTS</text>
      <rect x="1532" y="382" width="46" height="40" rx="4" fill="#e8b420"/><text x="1536" y="398" font-size="7" fill="#7a3a10">TATER</text>
      <rect x="1490" y="334" width="44" height="42" rx="4" fill="#f2c230" transform="rotate(-8 1512 355)"/><rect x="1500" y="332" width="12" height="7" fill="#222" transform="rotate(-8 1512 355)"/>
    </g>
    <rect x="1544" y="344" width="36" height="12" fill="#b8d8f0" opacity=".8"/><rect x="1544" y="358" width="36" height="12" fill="#b8d8f0" opacity=".8"/>
    <g fill="#a8b8c4"><rect x="1474" y="508" width="114" height="4"/><rect x="1474" y="590" width="114" height="4"/><rect x="1474" y="664" width="114" height="4"/></g>
    <g class="obj" data-id="kf-takeout"><path d="M1482 506 l4 -32 h34 l4 32z" fill="#f4f1ea"/><path d="M1490 474 q13 -14 26 0" stroke="#999" stroke-width="1.4" fill="none"/><path d="M1490 488 h26" stroke="#c33" stroke-width="2"/></g>
    <rect x="1534" y="470" width="20" height="36" rx="3" fill="#5a8a3a" opacity=".85"/><rect x="1533" y="466" width="22" height="7" fill="#c9b85a"/>
