    <g fill="#f4f0e6"><ellipse cx="1546" cy="582" rx="6" ry="7"/><ellipse cx="1560" cy="582" rx="6" ry="7"/><ellipse cx="1574" cy="582" rx="6" ry="7"/></g><rect x="1538" y="582" width="46" height="8" fill="#b8a88a"/>
