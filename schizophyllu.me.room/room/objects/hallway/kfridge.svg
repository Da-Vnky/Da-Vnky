    <g transform="rotate(-6 1508 650)"><rect x="1480" y="632" width="62" height="34" fill="#ece6c8"/><text x="1484" y="645" font-size="6.5" fill="#333">DO NOT FREEZE</text><text x="1484" y="656" font-size="6.5" fill="#333">THE SSD</text><text x="1522" y="662" font-size="7" fill="#c33">AGAIN</text></g>
    <g fill="#333"><rect x="1500" y="530" width="26" height="8" fill="#e8e0d0"/><text x="1502" y="536" font-size="5.5" fill="#333">temporary</text></g>
    <rect x="1540" y="690" width="28" height="8" fill="#e8e0d0"/><text x="1542" y="696" font-size="5.5" fill="#333">sleep?</text>
    <circle cx="1496" cy="336" r="5" fill="#6dffb0"/><rect x="1540" y="340" width="14" height="10" fill="#b98cff"/><circle cx="1566" cy="372" r="5" fill="#ffb347"/>
  </g>
