</defs>
  <rect x="58" y="118" width="284" height="334" fill="#241d19"/>
  <rect x="78" y="138" width="244" height="294" fill="url(#g-sky)"/>
  <g fill="#dfe8ff">
    <circle cx="150" cy="205" r="1"/>
    <circle cx="240" cy="236" r="1"/><circle cx="300" cy="275" r=".9"/>
    <circle cx="214" cy="190" r=".8"/>
  </g>
  <circle cx="276" cy="186" r="30" fill="#b8ccff" opacity=".12"/>
  <circle cx="276" cy="186" r="17" fill="#e4ebff"/>
  <circle cx="270" cy="182" r="3" fill="#c8d2ee"/><circle cx="281" cy="193" r="2" fill="#c8d2ee"/>
