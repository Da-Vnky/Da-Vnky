<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- glow-fridge (main): the fridge's light when it's open. a glow on its own: paint it however you like.
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes; the room blends it
     in "screen" mode (light only adds). not clickable.
     the code looks these ids up, so keep them: #fridgeglow -->
<!-- the gradient lives in the room file too; this copy is only so the file previews on its own -->
<defs class="preview">
  <radialGradient id="g-fridgelight">
    <stop offset="0" stop-color="#e8f4ff" stop-opacity=".55"/><stop offset="1" stop-color="#e8f4ff" stop-opacity="0"/>
  </radialGradient>
</defs>
  <ellipse id="fridgeglow" cx="1540" cy="600" rx="220" ry="280" fill="url(#g-fridgelight)" style="display:none"/>
</svg>
