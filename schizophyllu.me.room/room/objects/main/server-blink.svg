<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- server-blink (main): monad's LED rows, the parts of server.svg that blink or move. they sit on top of it, so a painted
     (flat) server keeps them. not clickable. drawn in room coordinates (the whole 1600x900 room). -->
<!-- shared with the room: this copy is only so the file previews on its own -->
<defs class="preview">
  <g id="ledrow">
    <rect width="3" height="3" x="0"  fill="#5dffa0"/>
    <rect width="3" height="3" x="6"  fill="#5dffa0" class="blink b2"/>
    <rect width="3" height="3" x="12" fill="#ffb347" class="blink b3"/>
    <rect width="3" height="3" x="18" fill="#5dffa0" class="blink b1"/>
  </g>
</defs>
  <use href="#ledrow" x="1212" y="404"/>
  <use href="#ledrow" x="1212" y="440"/>
  <use href="#ledrow" x="1212" y="480"/>
  <use href="#ledrow" x="1212" y="526"/>
  <use href="#ledrow" x="1212" y="562"/>
  <rect x="1218" y="368" width="3" height="3" fill="#5dffa0" class="blink b2"/>
  <rect x="1226" y="368" width="3" height="3" fill="#5dffa0" class="blink b1"/>
  <rect x="1234" y="368" width="3" height="3" fill="#5dffa0" class="blink b3"/>
</svg>
