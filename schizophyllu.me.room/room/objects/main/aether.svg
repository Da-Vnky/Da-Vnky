<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM VGA', monospace">
<!-- aether (main): skizy's tiny local model, a little robot sitting on monad's router
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes.
     the code looks these ids up, so keep them: #aether
     the face has two versions: class "face-on" (awake) and "face-off" (not running yet).
     the page shows one or the other -->
  <!-- legs, dangling over the front of the router -->
  <g fill="#9ea3b0"><rect x="1221" y="360" width="4" height="9" rx="2"/><rect x="1231" y="360" width="4" height="9" rx="2"/></g>
  <g fill="#6a6f7c"><rect x="1219" y="367" width="7" height="4" rx="2"/><rect x="1230" y="367" width="7" height="4" rx="2"/></g>
  <!-- body -->
  <rect x="1218" y="347" width="20" height="15" rx="4" fill="#c8ccd6"/>
  <rect x="1224" y="351" width="8" height="5" rx="1.5" fill="#ff9ad5" opacity=".7"/>
  <!-- little arms -->
  <path d="M1218 352 q-5 3 -4 8M1238 352 q5 3 4 8" stroke="#9ea3b0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- head, a screen for a face -->
  <rect x="1215" y="327" width="26" height="21" rx="5" fill="#d8dce6"/>
  <rect x="1218" y="330" width="20" height="14" rx="3" fill="#0b0c10"/>
  <g class="face-on">
    <path d="M1222 337 l2 -2.5 l2 2.5M1230 337 l2 -2.5 l2 2.5" stroke="#ff9ad5" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M1225.5 340 q2.5 2.4 5 0" stroke="#ff9ad5" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <circle cx="1221" cy="340.5" r="1.1" fill="#ff9ad5" opacity=".5"/><circle cx="1235" cy="340.5" r="1.1" fill="#ff9ad5" opacity=".5"/>
  </g>
  <g class="face-off">
    <path d="M1222 337.5h4M1230 337.5h4" stroke="#3a3d48" stroke-width="1.2"/>
  </g>
  <!-- antenna -->
  <path d="M1228 327 v-7" stroke="#9ea3b0" stroke-width="1.5"/>
  <circle class="antenna" cx="1228" cy="318.5" r="2.4" fill="#ff9ad5"/>
</svg>
