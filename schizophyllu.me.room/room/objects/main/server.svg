    <rect width="3" height="3" x="18" fill="#5dffa0" class="blink b1"/>
  </g>
</defs>
  <rect x="1200" y="378" width="84" height="358" fill="url(#g-server)"/>
  <rect x="1200" y="378" width="84" height="4" fill="#33363f"/>
