<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM VGA', monospace">
<!-- fridge (main): FRIDGE
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes.
     the code looks these ids up, so keep them: #fridge-closed, #fridge-open -->
<defs>
  <linearGradient id="g-fridge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#d9c6a6"/><stop offset=".25" stop-color="#9d998f"/><stop offset="1" stop-color="#55544f"/>
  </linearGradient>
</defs>
  <g id="fridge-open" style="display:none">
    <rect x="1504" y="392" width="92" height="346" rx="4" fill="#dfe9f2"/>
    <rect x="1504" y="392" width="92" height="76" fill="#cbdae6"/>
    <g stroke="#9fb3c4" stroke-width="3"><path d="M1506 468h88M1506 548h88M1506 628h88"/></g>
    <!-- freezer: tater tots -->
    <g class="obj" data-id="tots">
      <rect x="1514" y="420" width="46" height="44" rx="3" fill="#f2c230"/>
      <text x="1518" y="438" font-size="8" fill="#7a3a10">TATER</text><text x="1518" y="448" font-size="8" fill="#7a3a10">TOTS</text>
      <g fill="#c98a2a"><rect x="1520" y="452" width="8" height="6" rx="2"/><rect x="1532" y="453" width="8" height="6" rx="2"/><rect x="1544" y="452" width="8" height="6" rx="2"/></g>
    </g>
    <!-- ramen -->
    <g class="obj" data-id="ramen">
      <path d="M1512 516 h24 l-3 30 h-18z" fill="#f4f0e6"/><rect x="1512" y="514" width="24" height="5" fill="#c33"/>
      <path d="M1540 516 h24 l-3 30 h-18z" fill="#f4f0e6"/><rect x="1540" y="514" width="24" height="5" fill="#c33"/>
      <path d="M1526 596 h24 l-3 30 h-18z" fill="#f4f0e6"/><rect x="1526" y="594" width="24" height="5" fill="#e0a030"/>
    </g>
    <!-- monster -->
    <g class="obj" data-id="monster">
      <rect x="1568" y="514" width="14" height="32" rx="2" fill="#111"/><path d="M1572 520 l2 20 M1575 519 l1 21 M1578 520 l-1 20" stroke="#6dff5a" stroke-width="1.3"/>
      <rect x="1568" y="594" width="14" height="32" rx="2" fill="#111"/><path d="M1572 600 l2 20 M1575 599 l1 21 M1578 600 l-1 20" stroke="#6dff5a" stroke-width="1.3"/>
      <rect x="1554" y="676" width="14" height="32" rx="2" fill="#111"/><path d="M1558 682 l2 20 M1561 681 l1 21 M1564 682 l-1 20" stroke="#6dff5a" stroke-width="1.3"/>
    </g>
    <rect x="1512" y="690" width="30" height="18" rx="3" fill="#b0c890"/>
  </g>
  <g id="fridge-closed">
    <rect x="1504" y="392" width="92" height="346" rx="6" fill="url(#g-fridge)"/>
    <path d="M1504 470h92" stroke="#3a3935" stroke-width="2"/>
    <rect x="1512" y="414" width="6" height="36" rx="3" fill="#7a776e"/>
    <rect x="1512" y="486" width="6" height="64" rx="3" fill="#7a776e"/>
    <rect x="1534" y="500" width="40" height="46" fill="#ece6c8" transform="rotate(3 1554 523)"/>
    <text x="1538" y="514" font-size="7" fill="#333" transform="rotate(3 1554 523)">TRASH</text>
    <text x="1538" y="524" font-size="7" fill="#333" transform="rotate(3 1554 523)">DAY =</text>
    <text x="1540" y="538" font-size="10" fill="#c33" transform="rotate(3 1554 523)">??</text>
    <circle cx="1554" cy="498" r="3" fill="#c33"/>
    <circle cx="1530" cy="420" r="5" fill="#6dffb0"/><rect x="1560" y="426" width="14" height="10" fill="#b98cff"/>
  </g>
</svg>
