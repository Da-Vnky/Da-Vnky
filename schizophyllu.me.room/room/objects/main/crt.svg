    <stop offset="0" stop-color="#cfc6ab"/><stop offset=".6" stop-color="#a89f86"/><stop offset="1" stop-color="#7d7562"/>
  </linearGradient>
  <pattern id="p-scan" width="4" height="3" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity=".4"/>
  </pattern>
</defs>
<!-- shared with other things in the room: these copies are only here so this file previews right.
     the real ones live in the room file's <defs>, and the page ignores these -->
<defs class="preview">
