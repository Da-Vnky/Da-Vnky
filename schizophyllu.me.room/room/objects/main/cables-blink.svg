<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- cables-blink (main): the little lights in the tangle, the parts of cables.svg that blink or move. they sit on top of it, so a painted
     (flat) cables keeps them. not clickable. drawn in room coordinates (the whole 1600x900 room). -->
<defs>
  <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
  <g style="--d:-1.8s"><g transform="translate(1222 800) rotate(-12) scale(1.7)"><circle cx="-6" cy="-5" r="2" fill="#6dffb0" class="blink b1" filter="url(#f-glow)"/></g></g>
  <g style="--d:-1.8s"><g transform="translate(1222 800) rotate(-12) scale(1.7)"><circle cx="6" cy="-5" r="2" fill="#6dffb0" class="blink b1" filter="url(#f-glow)"/></g></g>
</svg>
