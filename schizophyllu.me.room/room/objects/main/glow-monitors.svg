<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900">
<!-- glow-monitors (main): skizy's desk monitors (cyan). a glow on its own: paint it however you like.
     drawn in room coordinates (the whole 1600x900 room), so it lands where it goes; the room blends it
     in "screen" mode (light only adds). not clickable. -->
<!-- the gradient lives in the room file too; this copy is only so the file previews on its own -->
<defs class="preview">
  <radialGradient id="g-cyan">
    <stop offset="0" stop-color="#7ad8ff" stop-opacity=".4"/><stop offset=".4" stop-color="#4aa8ff" stop-opacity=".12"/><stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/>
  </radialGradient>
</defs>
  <ellipse cx="1090" cy="470" rx="220" ry="180" fill="url(#g-cyan)"/>
</svg>
