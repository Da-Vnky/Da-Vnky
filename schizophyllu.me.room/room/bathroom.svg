<g class="obj" data-id="duck" data-art="room/objects/bathroom/duck.svg"></g>
<g class="obj" data-id="tpcbs" data-art="room/objects/bathroom/tpcbs.svg"></g>
<g class="obj" data-id="ipa" data-art="room/objects/bathroom/ipa.svg"></g>

<!-- ======================================== sink + mirror cabinet -->
