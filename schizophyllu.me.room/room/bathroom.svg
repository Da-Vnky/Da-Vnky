<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" id="bathroom" preserveAspectRatio="xMidYMid meet" font-family="'IBM VGA', monospace">
<defs>
  <linearGradient id="t-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a18"/><stop offset="1" stop-color="#26302c"/></linearGradient>
  <linearGradient id="t-porcelain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfcab4"/><stop offset="1" stop-color="#7c7866"/></linearGradient>
  <linearGradient id="t-rust" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a3a14" stop-opacity=".8"/><stop offset="1" stop-color="#7a3a14" stop-opacity="0"/></linearGradient>
  <radialGradient id="t-tube"><stop offset="0" stop-color="#dffff4" stop-opacity=".42"/><stop offset=".4" stop-color="#bfeee0" stop-opacity=".14"/><stop offset="1" stop-color="#bfeee0" stop-opacity="0"/></radialGradient>
  <radialGradient id="t-mold"><stop offset="0" stop-color="#0b120a" stop-opacity=".9"/><stop offset="1" stop-color="#0b120a" stop-opacity="0"/></radialGradient>
  <radialGradient id="t-vignette" cx=".5" cy=".5" r=".72"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".85"/></radialGradient>
  <pattern id="t-tile" width="40" height="30" patternUnits="userSpaceOnUse"><rect width="40" height="30" fill="#b3b8ab"/><path d="M0 29.5h40M39.5 0v30" stroke="#4a4d44" stroke-width="1.4"/></pattern>
  <pattern id="t-floor" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#c4c4b8"/><path d="M0 17.5h18M17.5 0v18" stroke="#3a3a34" stroke-width="1.2"/><rect x="9" y="0" width="8" height="8" fill="#9aa09a" opacity=".3"/></pattern>
  <filter id="t-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="t-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<!-- walls: peeling paint above, cracked tile below -->
<rect width="1600" height="700" fill="url(#t-wall)"/>
