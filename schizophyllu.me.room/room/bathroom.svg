  <circle cx="1240" cy="780" r="4" fill="none" stroke="#111" stroke-width="2"/>
</g>

<!-- shadows + light -->
<g pointer-events="none" fill="#000" filter="url(#t-soft)">
  <ellipse cx="300" cy="744" rx="280" ry="10" opacity=".5"/><ellipse cx="780" cy="742" rx="50" ry="6" opacity=".5"/>
  <ellipse cx="1074" cy="744" rx="80" ry="7" opacity=".5"/><ellipse cx="1378" cy="744" rx="60" ry="6" opacity=".5"/>
</g>
<g pointer-events="none" style="mix-blend-mode:screen">
