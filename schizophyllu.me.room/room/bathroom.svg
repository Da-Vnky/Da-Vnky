<rect class="t-flicker" x="622" y="44" width="356" height="8" rx="4" fill="#effff8" filter="url(#t-glow)"/>
<g fill="#222"><circle cx="700" cy="46" r="2"/><circle cx="700" cy="46" r="2"/></g>
<g pointer-events="none" fill="#000"><rect x="880" y="42" width="30" height="10" opacity=".5"/></g>

<!-- high frosted window -->
<g class="obj" data-id="twindow" data-art="room/objects/bathroom/twindow.svg"></g>

<!-- ======================================== the pipes -->
<g class="obj" data-id="pipes" data-art="room/objects/bathroom/pipes.svg"></g>

<!-- ======================================== bathtub -->
<g pointer-events="none">
  <rect x="30" y="166" width="544" height="5" rx="2" fill="#9a9a94"/>
</g>
<g class="obj" data-id="curtain" data-art="room/objects/bathroom/curtain.svg"></g>
<path d="M300 250 V282" stroke="#8e8a7c" stroke-width="6"/><ellipse cx="300" cy="288" rx="18" ry="7" fill="#9a968a"/>
<ellipse class="drip" cx="302" cy="298" rx="1.8" ry="2.6" fill="#bfe6ff"/>
