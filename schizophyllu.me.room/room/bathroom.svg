  <ellipse cx="1382" cy="170" rx="160" ry="120" fill="url(#t-tube)" opacity=".5"/>
</g>
<g pointer-events="none" opacity=".5">
  <rect x="0" y="660" width="1600" height="40" fill="#2a2a14" opacity=".5" filter="url(#t-soft)"/>
  <ellipse cx="300" cy="700" rx="300" ry="30" fill="#3a3418" opacity=".6" filter="url(#t-soft)"/>
  <ellipse cx="1080" cy="740" rx="100" ry="14" fill="#4a3a14" opacity=".6" filter="url(#t-soft)"/>
</g>
<rect width="1600" height="900" fill="#06120c" opacity=".38" pointer-events="none"/>
<rect width="1600" height="900" fill="url(#t-vignette)" pointer-events="none"/>
</svg>