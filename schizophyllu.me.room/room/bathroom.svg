  <circle cx="146" cy="16" r="12.2"/>
</g>
<rect y="330" width="1600" height="370" fill="url(#t-tile)"/>
<rect y="330" width="1600" height="370" fill="#0b120f" opacity=".5"/>
<rect y="326" width="1600" height="6" fill="#8a8e84"/>
