<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" id="closet" preserveAspectRatio="xMidYMid meet" font-family="'IBM VGA', monospace">
<defs>
  <linearGradient id="c-back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1a17"/><stop offset="1" stop-color="#2a2621"/></linearGradient>
  <linearGradient id="c-left" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d0c0a"/><stop offset="1" stop-color="#1e1b17"/></linearGradient>
  <linearGradient id="c-right" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#0d0c0a"/><stop offset="1" stop-color="#1e1b17"/></linearGradient>
  <linearGradient id="c-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e1812"/><stop offset="1" stop-color="#0a0806"/></linearGradient>
  <radialGradient id="c-bulb"><stop offset="0" stop-color="#ffd89a" stop-opacity=".6"/><stop offset=".35" stop-color="#ffb35a" stop-opacity=".2"/><stop offset="1" stop-color="#ffb35a" stop-opacity="0"/></radialGradient>
  <radialGradient id="c-moon"><stop offset="0" stop-color="#b8ccff" stop-opacity=".5"/><stop offset="1" stop-color="#b8ccff" stop-opacity="0"/></radialGradient>
  <radialGradient id="c-vignette" cx=".5" cy=".5" r=".7"><stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></radialGradient>
  <filter id="c-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<!-- a narrow closet, in perspective -->
<polygon points="0,0 1600,0 1300,120 300,120" fill="#12100d"/>
<polygon points="0,0 300,120 300,760 0,900" fill="url(#c-left)"/>
<polygon points="1600,0 1300,120 1300,760 1600,900" fill="url(#c-right)"/>
<rect x="300" y="120" width="1000" height="640" fill="url(#c-back)"/>
<polygon points="300,760 1300,760 1600,900 0,900" fill="url(#c-floor)"/>
<g stroke="#000" stroke-opacity=".4"><path d="M300 760 L0 900 M1300 760 L1600 900 M500 760 L360 900 M700 760 L640 900 M900 760 L960 900 M1100 760 L1240 900"/></g>
<!-- pencil marks on the drywall -->
<g stroke="#8a8272" stroke-opacity=".35" stroke-width="1" fill="none">
  <path d="M960 250 h60 M960 250 v-8 M1020 250 v-8"/><path d="M340 180 l30 0 M352 172 l0 16"/>
</g>
<text x="962" y="244" font-size="8" fill="#8a8272" opacity=".5">41 1/2</text>
<text x="1060" y="690" font-size="8" fill="#8a8272" opacity=".4">stud?</text>

<!-- the hatch and its light -->
<polygon points="690,28 910,28 930,104 670,104" fill="#0a0d18"/>
<polygon points="690,28 910,28 930,104 670,104" fill="url(#c-moon)"/>
<g fill="#dfe8ff" opacity=".7"><circle cx="760" cy="60" r="1.2"/><circle cx="840" cy="48" r="1"/><circle cx="880" cy="80" r=".9"/></g>
<polygon points="670,104 930,104 950,118 650,118" fill="#2a2621"/>
<polygon points="930,104 1010,40 1016,50 944,112" fill="#3a352e"/>

<g pointer-events="none">
<rect x="310" y="330" width="350" height="10" fill="#4a3a2a"/><rect x="310" y="340" width="350" height="3" fill="#000" opacity=".4"/>
<rect x="310" y="560" width="350" height="10" fill="#4a3a2a"/><rect x="310" y="570" width="350" height="3" fill="#000" opacity=".4"/>
<rect x="940" y="300" width="350" height="10" fill="#4a3a2a"/><rect x="940" y="310" width="350" height="3" fill="#000" opacity=".4"/>
<rect x="940" y="520" width="350" height="10" fill="#4a3a2a"/><rect x="940" y="530" width="350" height="3" fill="#000" opacity=".4"/>
</g>

<!-- left shelves: lights, spoingus i, the dead crt, routers -->
<g class="obj" data-id="xmas" data-art="room/objects/closet/xmas.svg"></g>
<g class="obj" data-id="spoingus1" data-art="room/objects/closet/spoingus1.svg"></g>
<g class="obj" data-id="deadcrt" data-art="room/objects/closet/deadcrt.svg"></g>
<g class="obj" data-id="routers" data-art="room/objects/closet/routers.svg"></g>
<g pointer-events="none">
  <rect x="470" y="510" width="16" height="50" fill="#111"/><rect x="472" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
  <rect x="490" y="514" width="16" height="46" fill="#111"/><rect x="492" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
  <rect x="510" y="510" width="16" height="50" fill="#111"/><rect x="512" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
  <rect x="530" y="514" width="16" height="46" fill="#111"/><rect x="532" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
  <rect x="550" y="510" width="16" height="50" fill="#111"/><rect x="552" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
  <rect x="570" y="514" width="16" height="46" fill="#111"/><rect x="572" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
  <rect x="590" y="510" width="16" height="50" fill="#111"/><rect x="592" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
  <rect x="610" y="514" width="16" height="46" fill="#111"/><rect x="612" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
  <rect x="630" y="510" width="16" height="50" fill="#111"/><rect x="632" y="520" width="12" height="16" fill="#e8e0d0" opacity=".6"/>
</g>

<!-- right shelves: keyboards, CABLES III, toolbox, sleeping bag, paint -->
<g pointer-events="none">
  <rect x="952" y="290" width="150" height="8" rx="2" fill="#d8d0c0"/>
  <rect x="955" y="281" width="150" height="8" rx="2" fill="#2a2a30"/>
  <rect x="958" y="272" width="150" height="8" rx="2" fill="#bdb6a6"/>
  <rect x="961" y="263" width="150" height="8" rx="2" fill="#111"/>
  <rect x="964" y="254" width="150" height="8" rx="2" fill="#8a8a90"/>
  <rect x="1116" y="236" width="80" height="64" fill="#a8804e"/><text x="1122" y="266" font-size="9" fill="#3a2410">CABLES III</text>
  <rect x="1204" y="250" width="30" height="50" fill="#8a9aa0"/><rect x="1242" y="258" width="34" height="42" fill="#c8c0a8"/><text x="1244" y="282" font-size="6" fill="#444">PAINT</text>
  <ellipse cx="1030" cy="496" rx="80" ry="24" fill="#2a4a3a"/><ellipse cx="960" cy="496" rx="14" ry="24" fill="#3a5a4a"/><path d="M1000 474 v44 M1060 474 v44" stroke="#1a2a22" stroke-width="3"/>
</g>
<g class="obj" data-id="toolbox" data-art="room/objects/closet/toolbox.svg"></g>
<!-- opi's terminal: a small monitor on a little wall shelf -->
<g class="obj" data-id="opi" data-art="room/objects/closet/opi.svg"></g>

<!-- the ladder -->
<g class="obj" data-id="ladder" data-art="room/objects/closet/ladder.svg"></g>

<!-- left wall: vacuum, broom, mop; right wall: coats, the telescope's case -->
<g class="obj" data-id="vacuum" data-art="room/objects/closet/vacuum.svg"></g>
<g pointer-events="none">
  <path d="M220 820 L270 420" stroke="#8a6a40" stroke-width="7"/><path d="M200 850 l40 -40 l30 4 l-10 50z" fill="#c8b890"/>
  <rect x="236" y="780" width="60" height="70" rx="4" fill="#3a6ad0"/><path d="M262 780 L252 470" stroke="#9a9a94" stroke-width="5"/>
  <path d="M40 420 L110 760" stroke="#9a9a94" stroke-width="5"/><path d="M60 420 L140 760" stroke="#9a9a94" stroke-width="5"/><path d="M30 440 L170 440" stroke="#cfcfc4" stroke-width="30" opacity=".8"/>
</g>
<g pointer-events="none">
  <path d="M1310 190 L1560 110" stroke="#777" stroke-width="5"/>
  <path d="M1340 188 q20 -12 36 -4 l30 60 l-6 300 l-80 0 l-4 -300z" fill="#2a2a3a"/>
  <path d="M1420 164 q20 -12 36 -4 l26 50 l-4 280 l-70 0 l0 -280z" fill="#3a2a22"/>
  <path d="M1490 140 q16 -10 30 -4 l20 40 l-2 240 l-60 0 l2 -240z" fill="#2c4637"/>
</g>
<g class="obj" data-id="scopecase" data-art="room/objects/closet/scopecase.svg"></g>
<g class="obj" data-id="sleepbag" data-art="room/objects/closet/sleepbag.svg"></g>
<!-- a hiking pack on the floor by the ladder, packed -->
<g class="obj" data-id="gobag" data-art="room/objects/closet/gobag.svg"></g>
<g pointer-events="none"><rect x="430" y="790" width="160" height="80" fill="#8a6440"/><rect x="430" y="790" width="160" height="10" fill="#6a4a30"/><g transform="rotate(-14 470 790)"><rect x="450" y="760" width="50" height="34" fill="#1d6a3a"/></g><text x="444" y="836" font-size="10" fill="#2a1a0a">E-WASTE 4</text></g>

<!-- the pull-chain bulb -->
<path d="M800 0 V120" stroke="#111" stroke-width="2"/>
<g class="obj" data-id="cbulb" data-art="room/objects/closet/cbulb.svg"></g>

<!-- light -->
<g pointer-events="none" style="mix-blend-mode:screen">
  <ellipse id="c-bulbglow" cx="800" cy="260" rx="700" ry="560" fill="url(#c-bulb)"/>
  <ellipse cx="800" cy="80" rx="240" ry="140" fill="url(#c-moon)" opacity=".7"/>
</g>
<rect id="c-darkness" width="1600" height="900" fill="#02030a" opacity=".7" pointer-events="none" style="display:none"/>
<rect width="1600" height="900" fill="url(#c-vignette)" pointer-events="none"/>
</svg>