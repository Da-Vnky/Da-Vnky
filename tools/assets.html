<!DOCTYPE html>
<html lang="en">
<head>

<title>assets · content manager · DaV-nky</title>
<!-- the asset manager: part of the content manager. open it with tools\content.bat.
     the list of slots comes from tools/slots.json. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="stylesheet" href="map.css">
<!-- the little companion's look: the same drawing and faces as the house (the menu at the top of its tab) -->
<link rel="stylesheet" href="/sky/css/kotodama.css">
<style>
    :root { --ink: #3a2716; --faded: #6e5236; --red: #9a3b1f; --card: #efe3c6; --green: #4f7a3a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #2a1d14; color: #f3e6c2; font: 1.05rem/1.5 "IM Fell English", Georgia, serif; }
    button, input { font: inherit; }
    header { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 22px 0;
        background: #3a2a1d; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
    header h1 { margin: 0 auto 0 12px; font: normal 1.6rem "IM Fell English SC", Georgia, serif; }
    .btn { padding: 8px 16px; border: 1px solid rgba(243,230,194,.35); border-radius: 999px; background: none; color: #f3e6c2; cursor: pointer; font-style: italic; }
    .btn:hover { background: rgba(243,230,194,.1); }
    .btn.main { background: var(--red); border-color: var(--red); }
    .btn.main:hover { background: #b24a28; }
    .status { width: 100%; margin: 0; font-style: italic; font-size: .92rem; color: rgba(243,230,194,.75); min-height: 1.4em; }
    .status.bad { color: #f0b08a; }
    .cm-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: .92rem; }
    .cm-nav span { font: normal 1rem "IM Fell English SC", Georgia, serif; color: #e0b070; margin-right: 6px; }
    .cm-nav a { padding: 3px 10px; border-radius: 999px; color: #f3e6c2; text-decoration: none; font-style: italic; }
    .cm-nav a:hover { background: rgba(243,230,194,.1); }
    .cm-nav a.on { background: #f3e6c2; color: #3a2716; }
    header { padding-bottom: 12px; }
    .layout { display: flex; align-items: flex-start; }
    .side { position: sticky; top: var(--head-h, 110px); flex: none; width: 230px; height: calc(100vh - var(--head-h, 110px)); overflow-y: auto;
        padding: 14px 0 30px; background: #33251a; box-shadow: 4px 0 14px rgba(0,0,0,.3); scrollbar-width: thin; }
    .side h3 { margin: 16px 18px 6px; font: normal .95rem "IM Fell English SC", Georgia, serif; color: #e0b070; letter-spacing: .03em; }
    .side h3:first-child { margin-top: 2px; }
    .tabs button { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; width: calc(100% - 12px); margin: 1px 0; border: 0;
        border-radius: 0 999px 999px 0; padding: 7px 14px 7px 18px; background: none; color: #f3e6c2; cursor: pointer; font-style: italic; text-align: left;
        transition: background .15s, padding .2s; }
    .tabs button:hover { background: rgba(243,230,194,.1); padding-left: 22px; }
    .tabs button[aria-selected=true] { background: #f3e6c2; color: #3a2716; box-shadow: inset 4px 0 0 var(--red); }
    .tabs button .n { font-size: .78rem; opacity: .75; font-style: normal; }
    .tabs button .mini-bar { grid-column: 1 / -1; height: 3px; border-radius: 9px; background: rgba(243,230,194,.14); overflow: hidden; }
    .tabs button[aria-selected=true] .mini-bar { background: rgba(58,39,22,.15); }
    .tabs button .mini-bar i { display: block; height: 100%; background: #7fae62; }
    .tabs button.found-tab { color: #cfe0a8; }
    .tabs button.found-tab[aria-selected=true] { color: #3a2716; }
    .side-toggle { display: none; }
    main { flex: 1; min-width: 0; max-width: 1280px; margin: 0 auto; padding: 18px 26px 80px; }
    @media (max-width: 820px) {
        .side-toggle { display: inline-block; }
        .side { position: fixed; left: 0; top: var(--head-h, 110px); z-index: 4; transform: translateX(-100%); transition: transform .3s cubic-bezier(.3,.7,.3,1); }
        body.side-open .side { transform: none; }
        main { padding: 16px 16px 80px; }
    }
    .intro { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin: 4px 0 6px; }
    .intro p { margin: 0; font-style: italic; color: rgba(243,230,194,.72); font-size: .95rem; }
    .intro a { color: #e0b070; font-style: italic; }
    .bar { flex: 1 1 200px; max-width: 320px; height: 8px; border-radius: 99px; background: rgba(243,230,194,.12); overflow: hidden; }
    .bar i { display: block; height: 100%; background: #7fae62; }
    h2 { margin: 26px 0 10px; font: normal 1.3rem "IM Fell English SC", Georgia, serif; }
    h2 small { font: italic .9rem "IM Fell English", Georgia, serif; color: rgba(243,230,194,.6); margin-left: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .card { position: relative; display: flex; flex-direction: column; background: var(--card); color: var(--ink); box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 0 0 26px rgba(120,80,30,.2); transition: outline-color .15s; outline: 3px dashed transparent; outline-offset: -3px; }
    .card.drop { outline-color: var(--red); }
    .card .look { height: 150px; display: grid; place-items: center; overflow: hidden;
        background: repeating-conic-gradient(#e6d8b6 0 25%, #f3ead2 0 50%) 0 0 / 18px 18px; }
    .card .look img, .card .look video { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card .look audio { width: 92%; }
    .card .look .stock.has-pic { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; height: 100%; box-sizing: border-box; }
    .stock-pic { width: 100%; flex: 1 1 auto; min-height: 0; display: block; }
    .lthumb .stock-pic { width: 100%; height: 100%; }
    .card .look .stock { font-style: italic; color: #8a7258; text-align: center; padding: 10px; background: rgba(243,234,210,.85); border: 1.5px dashed rgba(110,82,54,.45); border-radius: 8px; font-size: .9rem; }
    .card .look .fontdemo { font-size: 2.2rem; }
    .card .look .fontdemo.long { font-size: 1.35rem; line-height: 1.45; padding: 8px 12px; text-align: left; }
    .card .look pre { margin: 0; padding: 10px; width: 100%; height: 100%; overflow: hidden; font-size: .72rem; white-space: pre-wrap; background: rgba(255,255,255,.6); }
    .card .tag { position: absolute; top: 8px; right: 8px; padding: 0 9px; border-radius: 999px; font-size: .78rem; font-style: italic; background: rgba(110,82,54,.85); color: #f3e6c2; }
    .card .tag.yours { background: var(--green); }
    .card .meta { padding: 9px 13px 4px; }
    .card .meta b { display: block; font: normal 1rem ui-monospace, Menlo, Consolas, monospace; font-size: .86rem; color: var(--ink); word-break: break-all; }
    .card .meta .what { font-size: .92rem; }
    .card .meta .size { font-size: .82rem; font-style: italic; color: var(--faded); }
    .card .meta .file { font-size: .8rem; color: var(--faded); word-break: break-all; }
    .card .acts { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px 12px; margin-top: auto; }
    .card .acts button, .row button, .sm { padding: 5px 11px; border-radius: 999px; cursor: pointer; font-style: italic; border: 1px solid rgba(110,82,54,.35); background: #f8f0dc; color: var(--ink); white-space: nowrap; font-size: .92rem; }
    .card .acts button:hover, .row button:hover, .sm:hover { background: #fff8e6; }
    .card .acts .yes, .row .yes { background: var(--ink); color: #f3e6c2; border-color: var(--ink); }
    .card .acts .yes:hover, .row .yes:hover { background: var(--red); }
    .card .acts .no, .row .no { color: var(--red); }
    .card .twin { margin: 0 12px 10px; padding: 6px 9px; border-radius: 8px; background: rgba(110,82,54,.08); font-size: .85rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .card .twin img { width: 34px; height: 34px; object-fit: contain; background: repeating-conic-gradient(#e6d8b6 0 25%, #f3ead2 0 50%) 0 0 / 8px 8px; }
    .card .twin .tl { flex: 1; min-width: 90px; font-style: italic; color: var(--faded); }
    .card .twin button { padding: 2px 9px; font-size: .82rem; }
    .card.optional .meta b::after { content: "optional"; margin-left: 6px; padding: 0 6px; border-radius: 99px; background: rgba(110,82,54,.14); font: italic .72rem "IM Fell English", Georgia, serif; color: var(--faded); }
    /* lists (checklist, records, noise) */
    .sheet { background: var(--card); color: var(--ink); padding: 8px 16px; box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 0 0 26px rgba(120,80,30,.2); }
    .row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed rgba(110,82,54,.3); flex-wrap: wrap; }
    .row:last-child { border-bottom: 0; }
    .row .box { flex: none; width: 17px; height: 17px; border: 1.6px solid var(--faded); border-radius: 3px; }
    .row .main { flex: 1; min-width: 200px; }
    .row .main b { font: normal .86rem ui-monospace, Menlo, Consolas, monospace; }
    .row .main span { display: block; font-size: .9rem; font-style: italic; color: var(--faded); }
    .row .num { flex: none; width: 38px; font: normal 1.3rem "IM Fell English SC", Georgia, serif; color: var(--faded); text-align: right; }
    .row .sleeve { flex: none; width: 64px; height: 64px; background: #2a1d14; display: grid; place-items: center; color: #cdbb96; font-size: .7rem; font-style: italic; text-align: center; overflow: hidden; }
    .row .sleeve img { width: 100%; height: 100%; object-fit: cover; }
    /* a record's own vinyl: on a checkerboard, so its see-through parts show */
    .row .vinyl { flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #8a7258; font-size: .66rem; font-style: italic; text-align: center; overflow: hidden;
        background: repeating-conic-gradient(#d8c8a8 0 25%, #efe3c6 0 50%) 0 0 / 12px 12px; box-shadow: inset 0 0 0 1px rgba(110,82,54,.35); line-height: 1.1; }
    .row .vinyl img { width: 100%; height: 100%; object-fit: contain; }
    .row input.title { width: 100%; border: 0; border-bottom: 1px dashed transparent; background: none; color: var(--ink); font-size: 1.05rem; padding: 1px 0; }
    .row input.title:hover { border-bottom-color: rgba(110,82,54,.4); }
    .row input.title:focus { outline: none; border-bottom-color: var(--red); background: rgba(255,255,255,.4); }
    .row audio { height: 32px; width: 240px; max-width: 100%; }
    .row .btns { display: flex; gap: 5px; flex-wrap: wrap; }
    /* an album: its sleeve with a gold border inside the edge, and its songs listed under it */
    .row.album .sleeve { position: relative; }
    .row.album .sleeve::after { content: ""; position: absolute; inset: 4px; border: 2px solid transparent; pointer-events: none;
        border-image: linear-gradient(135deg, #6e4c14, #e9c96a 14%, #fff4c8 24%, #b8892e 38%, #f6dd8e 52%, #8a6320 64%, #ffeaa8 78%, #c29636 90%, #5e400e) 1; }
    .row .main span.kind { display: inline-block; font-style: italic; color: #3a2716; margin-left: 6px; padding: 0 8px; border-radius: 999px; background: linear-gradient(135deg, #b8892e, #f6dd8e 45%, #b8892e); color: #3a2716;
        font: italic .78rem "IM Fell English", Georgia, serif; vertical-align: middle; margin: 0 6px 0 0; }
    .row .songs { flex-basis: 100%; margin: 4px 0 2px 48px; padding: 4px 12px; border-left: 3px solid #c29636; background: rgba(196,154,82,.08); }
    .row .songs .row { padding: 5px 0; }
    .row .songs .num { width: 26px; font-size: 1rem; }
    .row .songs input.title { font-size: .98rem; }
    .row .songs audio { width: 200px; }
    .empty { font-style: italic; color: rgba(243,230,194,.55); }
    .sheet .empty { color: #8a7258; padding: 8px 0; }
    .opts { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 6px 0 4px; font-size: .95rem; font-style: italic; color: rgba(243,230,194,.75); }
    .opts input { accent-color: var(--red); }
    .folder-h { margin: 18px 0 6px; font: normal 1.05rem ui-monospace, Menlo, Consolas, monospace; color: #e0b070; }
    .folder-h small { font: italic .9rem "IM Fell English", Georgia, serif; color: rgba(243,230,194,.6); margin-left: 8px; }
    /* the list view */
    .viewswitch { display: inline-flex; margin-left: auto; border: 1px solid rgba(243,230,194,.3); border-radius: 999px; overflow: hidden; }
    .viewswitch button { border: 0; padding: 4px 14px; background: none; color: #f3e6c2; cursor: pointer; font-style: italic; font-size: .92rem; }
    .viewswitch button[aria-pressed=true] { background: #f3e6c2; color: #3a2716; }
    .lrows { background: var(--card); color: var(--ink); box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 0 0 26px rgba(120,80,30,.2); }
    .lrow { border-bottom: 1px dashed rgba(110,82,54,.3); outline: 3px dashed transparent; outline-offset: -3px; }
    .lrow:last-child { border-bottom: 0; }
    .lrow.drop { outline-color: var(--red); }
    .lhead { display: flex; align-items: center; gap: 12px; padding: 7px 12px; cursor: pointer; }
    .lhead:hover { background: rgba(255,255,255,.35); }
    .lthumb { flex: none; width: 44px; height: 44px; display: grid; place-items: center; overflow: hidden; border-radius: 4px; font-size: 1.1rem; color: var(--faded);
        background: repeating-conic-gradient(#e6d8b6 0 25%, #f3ead2 0 50%) 0 0 / 10px 10px; }
    .lthumb img, .lthumb video { max-width: 100%; max-height: 100%; object-fit: contain; }
    .lthumb.none { border: 1.5px dashed rgba(110,82,54,.4); background: none; font-size: .8rem; }
    .lname { flex: 1; min-width: 0; }
    .lname b { display: block; font: normal .88rem ui-monospace, Menlo, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lname span { display: block; font-size: .86rem; font-style: italic; color: var(--faded); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lrow .ltag { flex: none; padding: 0 9px; border-radius: 999px; font-size: .76rem; font-style: italic; background: rgba(110,82,54,.8); color: #f3e6c2; }
    .lrow .ltag.yours { background: var(--green); }
    .lrow .ltag.opt { background: rgba(110,82,54,.14); color: var(--faded); }
    .lrow .lup { flex: none; padding: 5px 14px; border-radius: 999px; cursor: pointer; font-style: italic; border: 1px solid var(--ink); background: var(--ink); color: #f3e6c2; font-size: .9rem; }
    .lrow .lup:hover { background: var(--red); border-color: var(--red); }
    .lrow .chev { flex: none; width: 16px; color: var(--faded); transition: transform .2s; }
    .lrow.open .chev { transform: rotate(90deg); }
    .lbody { padding: 4px 12px 14px 68px; }
    .lbody .card { box-shadow: none; background: rgba(255,255,255,.35); max-width: 520px; }
    .lbody .card .look { height: 220px; }
    @media (max-width: 620px) { .lbody { padding-left: 12px; } .lname span { white-space: normal; } }
    .reset-plan { background: var(--card); color: var(--ink); padding: 12px 18px; box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 0 0 26px rgba(120,80,30,.2); }
    .reset-plan p { margin: 4px 0; }
    .reset-plan b { font-weight: normal; font-family: "IM Fell English SC", Georgia, serif; color: var(--red); }
    .reset-plan .dim { color: var(--faded); font-style: italic; font-size: .92rem; }
    .note-ed { background: var(--card); color: var(--ink); padding: 12px 16px; box-shadow: 0 8px 18px rgba(0,0,0,.4), inset 0 0 26px rgba(120,80,30,.2); max-width: 720px; }
    .note-ed label { display: block; margin: 6px 0 2px; font-size: .9rem; font-style: italic; color: var(--faded); }
    .note-ed input, .note-ed textarea { width: 100%; padding: 6px 9px; border: 1px solid rgba(110,82,54,.35); border-radius: 6px; background: #fbf5e6; color: var(--ink); font: inherit; }
    .note-ed textarea { min-height: 160px; resize: vertical; }
    .note-ed .acts { display: flex; gap: 8px; margin-top: 10px; }
    .swap-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 4px; }
    .swap-add input { flex: 1 1 280px; max-width: 420px; padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(243,230,194,.35); background: #3a2a1d; color: #f3e6c2; font: .9rem ui-monospace, Menlo, Consolas, monospace; }
    [hidden] { display: none !important; }
    /* the map of a scene: the page itself, small, with every slot outlined on it (tools/map.js, map.css) */
    .map { position: relative; margin: 14px 0 6px; }
    /* the whole scene in Blender, and its post-processing back to the site (the top of a scene's tab) */
    .scene3d { margin: 6px 0 14px; padding: 10px 14px; border: 1px solid rgba(243,230,194,.22); border-radius: 10px; background: rgba(20,13,8,.35); color: rgba(243,230,194,.85); font-size: .92rem; }
    .scene3d .s3-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .scene3d button { padding: 5px 14px; }
    .scene3d button:disabled { opacity: .5; cursor: progress; }
    .scene3d label { display: inline-flex; align-items: center; gap: 6px; font-style: italic; }
    .scene3d input { accent-color: var(--red); }
    .scene3d .s3-note { margin: 6px 0 0; font-style: italic; color: rgba(243,230,194,.62); font-size: .86rem; line-height: 1.45; }
    .scene3d .s3-now { margin: 6px 0 0; font-size: .86rem; color: rgba(243,230,194,.8); }
    .scene3d .s3-now b { color: #f3e6c2; font-weight: normal; font-style: italic; }
    .scene3d .s3-busy { color: #e0b070; font-style: italic; }
    .scene3d .linkish { color: #e0b070; font-style: italic; cursor: pointer; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }
    .scene3d .s3-post { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }
    .scene3d .s3-post figure { margin: 0; width: 138px; font-size: .78rem; text-align: center; }
    .scene3d .s3-post figure span { display: block; height: 78px; border-radius: 6px; background: repeating-conic-gradient(#3a2a1d 0 25%, #2c2016 0 50%) 0 0 / 12px 12px; overflow: hidden; }
    .scene3d .s3-post img { width: 100%; height: 100%; object-fit: contain; }
    .scene3d .s3-post figcaption { margin-top: 3px; overflow-wrap: anywhere; }
    .scene3d .s3-post button { margin-top: 3px; padding: 2px 9px; font-size: .78rem; }
    .map-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 0 8px; font-size: .92rem; font-style: italic; color: rgba(243,230,194,.8); }
    .map-bar label { display: inline-flex; align-items: center; gap: 6px; }
    .map-bar select { font: inherit; font-style: normal; font-size: .88rem; padding: 3px 8px; border-radius: 999px; border: 1px solid rgba(243,230,194,.35); background: #3a2a1d; color: #f3e6c2; }
    .map-bar input { accent-color: var(--red); }
    .map-bar .grow { flex: 1; }
    .map-bar a, .map-bar .linkish { color: #e0b070; font-style: italic; cursor: pointer; background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
    .map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 0; font-size: .86rem; font-style: italic; color: rgba(243,230,194,.7); }
    .map-legend i { display: inline-block; width: 22px; height: 12px; margin-right: 5px; vertical-align: -1px; border: 2px dashed #ff5a36; background: rgba(255,90,54,.12); }
    .map-legend i.mine { border: 2px solid #7fd05a; background: none; }
    .map-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #120c08; box-shadow: 0 10px 26px rgba(0,0,0,.5); outline: 1px solid rgba(243,230,194,.2); }
    .map-stage iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; background: #120c08; }
    .map-hit { position: absolute; inset: 0; cursor: crosshair; }
    .map-hit.on-box { cursor: pointer; }
    .map-veil { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(18,12,8,.82); color: #f3e6c2; font-style: italic; transition: opacity .4s; }
    .map-veil.gone { opacity: 0; pointer-events: none; }
    .map-tip { position: absolute; z-index: 6; max-width: 320px; padding: 6px 10px; border-radius: 6px; background: rgba(42,29,20,.95); color: #f3e6c2; font-size: .86rem; line-height: 1.35;
        pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.5); }
    .map-tip b { font: normal .84rem ui-monospace, Menlo, Consolas, monospace; color: #ffe27a; }
    .map-tip .st { display: block; font-style: italic; color: rgba(243,230,194,.75); }
    .map-stage.dropping { outline: 3px dashed var(--red); }
    .map-off { margin: 10px 0 0; }
    .map-off summary { cursor: pointer; color: #e0b070; }
    .map-off h3 { display: inline; margin: 0 0 6px; font: normal 1rem "IM Fell English SC", Georgia, serif; color: #e0b070; }
    .map-off h3 small { font: italic .88rem "IM Fell English", Georgia, serif; color: rgba(243,230,194,.6); margin-left: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 4px; border-radius: 999px; border: 1.5px dashed #ff8a66; background: rgba(255,90,54,.08); color: #f3e6c2;
        cursor: pointer; font: .82rem ui-monospace, Menlo, Consolas, monospace; outline: 3px dashed transparent; }

        95% { transform: scale(.95, 1.07); } 100% { transform: scale(1, 1); } }
    .lk-faces { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 4px; }

<body>
<header>
    <nav class="cm-nav"><span>content manager</span><a href="letters.html">your letters</a><a href="shelves.html">your things</a><a href="post.html">visitors</a><a href="notes.html">notes</a><a href="assets.html" class="on">assets</a><a href="kotodama.html">companion</a><a href="debug.html">debug</a></nav>
    <h1>assets</h1>
    <button type="button" class="btn publish">publish to the live site</button>
    <button type="button" class="btn side-toggle" aria-label="show the list of scenes">&#9776; scenes</button>
    <p class="status">every picture and sound on the site is a slot. replace one, and the stand-in steps aside. (you can also drop a file straight onto a card.)</p>
</header>
<div class="layout">
    <aside class="side"><nav class="tabs" role="tablist" aria-orientation="vertical" aria-label="scenes"></nav></aside>
    <main></main>
</div>
<input type="file" class="file-in" hidden>

<!-- the resets: the same plan the site plays by (sky/state.js) -->
<script src="/sky/state.js"></script>
<!-- where each slot sits on a page (the scenes' maps, and tools/templates.py's pictures) -->
<script src="map.js"></script>
<!-- how the little companions look, and who comes which day (sky/kotodama.js draws them from it too) -->
<script src="/sky/kotodama-look.js"></script>
<script>
(function () {
    var $ = function (s, r) { return (r || document).querySelector(s); };
    var statusEl = $('.status'), main = $('main'), tabsEl = $('.tabs'), fileIn = $('.file-in');
    var CAT = null, STATE = { files: {}, tracks: [], noise: [] }, tab = 'everywhere', showOptional = false, view = 'list', openRows = {};
    try { tab = sessionStorage.getItem('assets-tab') || tab; view = localStorage.getItem('assets-view') || view; } catch (e) {}
    var PICS = /\.(svg|png|webp|gif|jpe?g)$/i, VIDS = /\.(webm|mp4)$/i, SOUNDS = /\.(mp3|ogg)$/i;
    var ORDER = ['svg', 'gif', 'webp', 'png', 'jpg', 'jpeg', 'webm', 'mp4', 'mp3', 'ogg', 'json', 'woff2', 'woff', 'ttf', 'otf'];

    function say(t, bad) { statusEl.textContent = t || ''; statusEl.className = 'status' + (bad ? ' bad' : ''); }
    var OLD = { error: 'the content manager window that’s open is an older version. close its black window, then double-click tools\\content.bat again' };
    function answer(r) { return r.json().then(function (j) { return j && j.error === 'unknown' ? OLD : j; }, function () { return OLD; }); }
    var DOWN = { error: 'the manager isn’t running. open it with tools\\content.bat' };
    function api(path, body) {
        var opt = body === undefined ? {} : { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'application/json' } };
        return fetch(path, opt).then(answer, function () { return DOWN; });
    }
    function send(path, file, headers) {
        var h = { 'Content-Type': 'application/octet-stream', 'X-Name': encodeURIComponent(file.name) };
        Object.keys(headers || {}).forEach(function (k) { h[k] = encodeURIComponent(headers[k]); });
        return fetch(path, { method: 'POST', body: file, headers: h }).then(answer, function () { return DOWN; });
    }
    function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
    function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
    function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
    function btn(label, fn, cls) { var b = el('button', cls); b.type = 'button'; b.textContent = label; b.addEventListener('click', fn); return b; }

    /* ---------------- which file fills a slot ---------------- */
    function parts(slot) { var m = /^assets\/([a-z0-9-]+)\/([a-z0-9-]+)$/.exec(slot); return m ? { folder: m[1], stem: m[2] } : null; }
    function fileFor(slot) {
        var rm = /^assets\/resets\/reset-([1-8])\/(.+)$/.exec(slot);
        if (rm) {                                                          // one of a reset's own (assets/resets/reset-<n>/…)
            var mine = ((STATE.resets || {})[rm[1]] || []).filter(function (f) { return f.path.replace(/\.[^.\/]+$/, '') === rm[2]; });
            mine.sort(function (a, b) { return ORDER.indexOf(a.path.split('.').pop().toLowerCase()) - ORDER.indexOf(b.path.split('.').pop().toLowerCase()); });
            var h = mine[0];
            return h ? { name: h.path.split('/').pop(), size: h.size, time: h.time, url: '/assets/resets/reset-' + rm[1] + '/' + h.path.split('/').map(encodeURIComponent).join('/') + '?t=' + h.time } : null;
        }
        var p = parts(slot);
        if (!p) return null;
        var hits = (STATE.files[p.folder] || []).filter(function (f) { return f.name.replace(/\.[^.]+$/, '') === p.stem; });
        hits.sort(function (a, b) { return ORDER.indexOf(a.name.split('.').pop().toLowerCase()) - ORDER.indexOf(b.name.split('.').pop().toLowerCase()); });
        return hits[0] ? { name: hits[0].name, size: hits[0].size, time: hits[0].time, url: '/assets/' + p.folder + '/' + encodeURIComponent(hits[0].name) + '?t=' + hits[0].time } : null;
    }
    function accept(kind) { return (CAT.kinds[kind] || CAT.kinds.image).map(function (e) { return '.' + e; }).join(','); }
    // which tab a slot found on the site (but not in tools/slots.json) belongs in
    var HOME = { sky: 'everywhere', ui: 'everywhere', fonts: 'everywhere', sea: 'sea', workshop: 'workshop', countryside: 'workshop',
                 city: 'city', living: 'living', characters: 'characters', sounds: 'sounds', items: 'loot', textures: 'everywhere' };
    var SCENES = [];
    function buildScenes() {
        var known = {};
        CAT.scenes.forEach(function (sc) { sc.groups.forEach(function (g) { g.slots.forEach(function (x) { known[x.slot] = 1; known[x.slot + '-glow'] = 1; }); }); });
        CAT.noise.forEach(function (n) { known['assets/sounds/' + n.name] = 1; });
        (STATE.noise || []).forEach(function (n) { known['assets/sounds/' + n.name] = 1; });
        SCENES = CAT.scenes.map(function (sc) { return { id: sc.id, name: sc.name, page: sc.page, note: sc.note, map: sc.map, groups: sc.groups.slice() }; });
        var extra = {};
        (STATE.found || []).forEach(function (f) {
            if (known[f.slot]) return;
            var p = parts(f.slot), id = p.folder === 'living' && /^bath-/.test(p.stem) ? 'bathroom' : p.folder === 'living' && /^(dungeon-|candle)/.test(p.stem) ? 'dungeon' : HOME[p.folder] || ('folder-' + p.folder);
            var kind = p.folder === 'sounds' ? 'sound' : p.folder === 'fonts' ? 'font' : /^model-\d+$/.test(p.stem) ? 'model' : 'image';
            (extra[id] = extra[id] || { folder: p.folder, slots: [] }).slots.push({ slot: f.slot, what: 'used in ' + f.where.join(', ') + ' (not described yet)', kind: kind, found: true });
        });
        Object.keys(extra).forEach(function (id) {
            var sc = SCENES.filter(function (x) { return x.id === id; })[0];
            if (!sc) { sc = { id: id, name: 'assets/' + extra[id].folder, groups: [], isNew: true, note: 'a folder the site uses that doesn\u2019t have a tab of its own yet.' }; SCENES.push(sc); }
            sc.groups.push({ name: 'found on the site', sub: 'new pieces the pages use that aren\u2019t described in tools/slots.json yet', slots: extra[id].slots });
        });
    }
    function allSlots() {
        var out = [];
        SCENES.forEach(function (sc) { sc.groups.forEach(function (g) { g.slots.forEach(function (s) { out.push(s); if (s.glow) out.push({ slot: s.slot + '-glow', what: 'the glow twin of ' + s.slot.split('/').pop(), optional: true, twin: true }); }); }); });
        CAT.noise.forEach(function (n) { out.push({ slot: 'assets/sounds/' + n.name, what: 'the noise machine’s ' + n.label, kind: 'sound', optional: true }); });
        var seen = {};
        return out.filter(function (s) { if (seen[s.slot]) return false; seen[s.slot] = 1; return true; });
    }

    /* ---------------- picking and dropping files ---------------- */
    var picked = null;
    function pick(acc, multiple, fn) { fileIn.accept = acc || ''; fileIn.multiple = !!multiple; picked = fn; fileIn.click(); }
    fileIn.addEventListener('change', function () {
        var files = Array.prototype.slice.call(fileIn.files);
        fileIn.value = '';
        if (files.length && picked) picked(files);
    });
    function droppable(node, fn) {
        node.addEventListener('dragover', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') !== -1) { e.preventDefault(); node.classList.add('drop'); } });
        node.addEventListener('dragleave', function () { node.classList.remove('drop'); });
        node.addEventListener('drop', function (e) { e.preventDefault(); node.classList.remove('drop'); var f = e.dataTransfer.files; if (f && f.length) fn(Array.prototype.slice.call(f)); });
    }
    document.addEventListener('dragover', function (e) { e.preventDefault(); });
    document.addEventListener('drop', function (e) { e.preventDefault(); });

    function put(slot, kind, file) {
        say('putting ' + file.name + ' in ' + slot + '…');
        return send('/__assets/put', file, { 'X-Slot': slot, 'X-Kind': kind || 'image' }).then(function (r) {
            if (r.error) say(file.name + ': ' + r.error, true);
            else artChanged++;
            if (!r.error) say('saved as ' + slot.replace(/[^\/]+$/, '') + r.name + (file.size > 2 * 1048576 ? ' (it’s ' + kb(file.size) + ': big files make the page slow to load)' : '') + '. publish when you’re ready.');
            return load();
        });
    }
    function clear(slot) {
        if (!confirm('take your file out of ' + slot + '? the stand-in comes back (on the live site once you publish).')) return;
        api('/__assets/clear', { slot: slot }).then(function (r) { if (r.error) say(r.error, true); else artChanged++, say('removed ' + (r.removed || []).join(', ') + '. the stand-in is back.'); load(); });
    }

    /* ---------------- a slot's card ---------------- */
    // a stand-in that's a file of its own (skizy's room: her drawings, each the size of the whole room), shown
    // zoomed in on the thing (crop: x y w h in the room, measured when the slot was described)
    function stockPic(s) {
        if (!s || !s.stock) return '';
        return '<svg class="stock-pic" viewBox="' + esc(s.crop || '0 0 1600 900') + '" preserveAspectRatio="xMidYMid meet">' +
            '<image href="/' + esc(s.stock) + '" x="0" y="0" width="1600" height="900"/></svg>';
    }
    function preview(f, kind, s) {
        if (!f && s && s.stock) return '<div class="stock has-pic">' + stockPic(s) + '<small>the stand-in (' + (s.kind === 'svg' ? 'SVG only' : 'skizy\u2019s drawing') + ')</small></div>';
        if (f && s && s.stock && s.crop && PICS.test(f.name)) return stockPic({ stock: f.url.replace(/^\//, ''), crop: s.crop });
        if (!f) return '<div class="stock">the stand-in<br><small>(' + (kind === 'sound' ? 'the page makes this sound itself' : kind === 'font' ? 'the default lettering' : 'the drawing that’s there now') + ')</small></div>';
        if (PICS.test(f.name)) return '<img alt="" loading="lazy" src="' + f.url + '">';
        if (VIDS.test(f.name)) return '<video muted loop autoplay playsinline src="' + f.url + '"></video>';
        if (SOUNDS.test(f.name)) return '<audio controls preload="none" src="' + f.url + '"></audio>';
        if (/\.json$/i.test(f.name)) return '<pre data-json="' + f.url + '">…</pre>';
        return '<div class="fontdemo' + (s && s.demo ? ' long' : '') + '">' + esc(s && s.demo || 'Aa') + '</div>';
    }
    /* ---------------- the drawing table: draw it, or animate it, in your own program ---------------- */
    // (tools/drawtable.py through the content manager: a canvas twice the size it's shown at, with a guide of the scene,
    // opened in Clip Studio, Photoshop, Rebelle or Blender (a scene: tools/blender/slot_scene.py); or an animation in Clip Studio or the Rebelle Animator. what you export
    // back into its folder shows here, with "use this")
    var DT = { table: {}, key: '', panels: [] };
    function drawable(s, kind) { return s.handwriting || kind === 'image' && s.kind !== 'svg' && !/^assets\/(sounds|fonts)\//.test(s.slot) && !/^assets\/resets\/[^\/]+$/.test(s.slot); }
    function ago(t) { var m = Math.round((Date.now() / 1000 - t) / 60); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' days ago'; }
    function drawPanel(s, viewName) {

    // a repeating picture laid out as it'll repeat (three copies, the joins marked), and a word on whether the join shows:
    // the edges that meet are compared with how much the picture changes from one column (or row) to the next inside it
    function repeatStrip(url, axis, note) {
        var c = document.createElement('canvas'), wrap = el('span', 'dt-rep ' + (axis === 'y' ? 'tall' : 'wide'));
        wrap.appendChild(c);
        var img = new Image();
        img.onload = function () {
            var W = img.naturalWidth, H = img.naturalHeight; if (!W || !H) return;
            var n = 3, x = c.getContext('2d'), across = axis.indexOf('x') > -1, down = axis.indexOf('y') > -1;
            var tw, th;
            if (across && !down) { th = 52; tw = W * th / H; c.width = Math.round(tw * n); c.height = th; }
            else if (down && !across) { tw = Math.max(14, Math.min(60, W * 120 / H)); th = H * tw / W; c.width = Math.round(tw); c.height = Math.round(th * n); }
            else { tw = th = 40; c.width = c.height = 120; }
            for (var i = 0; i < (across ? n : 1); i++) for (var j = 0; j < (down ? n : 1); j++) x.drawImage(img, i * tw, j * th, tw, th);
            // how well the edges meet (at most 1024 px along the join, for speed)
            var k = Math.min(1, 1024 / Math.max(W, H)), w = Math.max(2, Math.round(W * k)), h = Math.max(2, Math.round(H * k));
            var o = document.createElement('canvas'); o.width = w; o.height = h;
            var q = o.getContext('2d'); q.drawImage(img, 0, 0, w, h);
            var d; try { d = q.getImageData(0, 0, w, h).data; } catch (e) { return; }
            function px(a, b) { var p = (b * w + a) * 4; return [d[p] * d[p + 3] / 255, d[p + 1] * d[p + 3] / 255, d[p + 2] * d[p + 3] / 255, d[p + 3]]; }
            function diff(a1, b1, a2, b2) { var u = px(a1, b1), v = px(a2, b2); return (Math.abs(u[0] - v[0]) + Math.abs(u[1] - v[1]) + Math.abs(u[2] - v[2]) + Math.abs(u[3] - v[3])) / 4; }
            function cols(c1, c2) { var s = 0; for (var r = 0; r < h; r++) s += diff(c1, r, c2, r); return s / h; }
            function rows(r1, r2) { var s = 0; for (var cc = 0; cc < w; cc++) s += diff(cc, r1, cc, r2); return s / w; }
            var bad = [];
            function judge(seam, inside) { return seam > inside * 2.5 + 6; }
            if (across) { var inX = (cols(Math.floor(w / 3), Math.floor(w / 3) + 1) + cols(Math.floor(2 * w / 3), Math.floor(2 * w / 3) + 1)) / 2; if (judge(cols(w - 1, 0), inX)) bad.push('the left and right edges'); }
            if (down) { var inY = (rows(Math.floor(h / 3), Math.floor(h / 3) + 1) + rows(Math.floor(2 * h / 3), Math.floor(2 * h / 3) + 1)) / 2; if (judge(rows(h - 1, 0), inY)) bad.push('the top and bottom edges'); }
            x.strokeStyle = bad.length ? 'rgba(200,40,30,.9)' : 'rgba(60,130,60,.55)'; x.lineWidth = 1.5; x.setLineDash(bad.length ? [] : [3, 3]);
            x.beginPath();

            if (down) for (var b2 = 1; b2 < n; b2++) { x.moveTo(0, Math.round(b2 * th) + .5); x.lineTo(c.width, Math.round(b2 * th) + .5); }
            x.stroke();
            if (note) note.appendChild(el('span', bad.length ? 'warn' : 'ok', bad.length ? ' · the join shows: ' + bad.join(' and ') + ' don’t meet (marked red). “wrap it” to mend it' : ' · it repeats with no join showing'));
        };

    var SCENE3D = {};
    function sceneBlock(sc) {

        box.appendChild(row);

            ' (in the map’s “show” view below). Add depth of field, fog, light and compositing in Blender and save; then post-processing → site.' +
            ' The toy camera (the page seen through a lens: it slides with the pointer, sways, has grain and dark corners, and moves its focus to what you point at)' +

        own.querySelector('input').addEventListener('change', function () {

                if (r.error) return say(r.error, true);
                say((keep ? 'the page’s own blur stays' : 'the page’s own blur is off') + (r.onSite ? ': on the site now (have a look).' : ': it goes on the site with the next post-processing.'));
            });

                        if (r.error) return say(r.error, true);
                        say(slot.replace(/^assets\//, '') + (flatNow ? ' comes in as its flat picture' : ' comes in as 3D') + ' from the next “a fresh copy”.');
                    });

                row.appendChild(l);

            });
            threeBox.appendChild(row);
        }
        var timer = null;

        function start(what) {

    function drawScene(sc) {
        var slots = []; sc.groups.forEach(function (g) { slots = slots.concat(g.slots); });
        var top = intro(sc.note, sc.map ? '' : sc.page, slots);
        if (!sc.map) top.appendChild(viewSwitch());

    // a new album: songs (and a cover picture, if one was picked with them) all at once
    function addAlbum(files) {
        var songs = files.filter(function (f) { return /\.(mp3|ogg)$/i.test(f.name); }).sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
        var cover = files.filter(function (f) { return PICS.test(f.name); })[0];
        if (songs.length < 2) return say('an album is two songs or more (.mp3 or .ogg), picked all at once. one song? “+ add songs”.', true);
        var title = prompt('what’s the album called? (' + songs.length + ' songs' + (cover ? ', and ' + cover.name + ' for its cover' : '') + ')', '');
        if (title === null) return;
        title = title.trim() || 'an album';
        say('making the album…');
        api('/__records/album-new', { title: title }).then(function (x) {
            if (x.error) return say(x.error, true);
            return addToAlbum(x.name, songs, cover);
        });
    }
    function addToAlbum(name, files, cover) {
        var songs = files.filter(function (f) { return /\.(mp3|ogg)$/i.test(f.name); }).sort(function (a, b) { return a.name.localeCompare(b.name, undefined, { numeric: true }); });
        cover = cover || files.filter(function (f) { return PICS.test(f.name); })[0];
        if (!songs.length && !cover) return say('songs are .mp3 or .ogg files.', true);
        var added = [], errs = [];
        say('adding ' + songs.length + (songs.length === 1 ? ' song' : ' songs') + ' to ' + name + '…');
        return songs.reduce(function (p, f, i) {
            return p.then(function () {
                say('adding ' + (i + 1) + ' of ' + songs.length + ': ' + f.name + '…');
                return send('/__records/album-add', f, { 'X-Album': name }).then(function (x) { if (x.error) errs.push(f.name + ': ' + x.error); else added.push(x.name); });
            });
        }, Promise.resolve()).then(function () {
            if (!cover) return;
            return send('/__records/sleeve', cover, { 'X-Song': name }).then(function (x) { if (x.error) errs.push(cover.name + ': ' + x.error); });
        }).then(function () {
            say((added.length ? name + ': ' + added.length + (added.length === 1 ? ' song' : ' songs') + ' on it' + (cover ? ', with its cover' : '') + '. publish when you’re ready.' : '') +
                (errs.length ? ' ' + errs.join('; ') : ''), errs.length && !added.length);
            load();
        });
    }

        });
        ed.querySelector('.n-save').addEventListener('click', function () {
            api('/__resets/note/save', { n: n, title: ed.querySelector('.n-title').value, text: ed.querySelector('.n-text').value, sign: ed.querySelector('.n-sign').value })
                .then(function (d) { if (d.error) say(d.error, true); else { say('the note for reset ' + n + ' is saved. publish when you’re ready.'); load(); } });
        });

        var pieces = [];
        live.forEach(function (k) { (D[k].slots || []).forEach(function (sl) { pieces.push({ slot: sl, what: D[k].name + ': ' + whatOf(sl) }); }); });
        justGone.forEach(function (k) { (D[k].patchSlots || []).forEach(function (sl) { pieces.push({ slot: sl, what: D[k].patch + ' (from reset ' + n + ' on)' }); }); });
        if (pieces.length) {
            main.appendChild(el('h2', '', 'the pieces for its deaths and patches <small>the same picture in every reset they’re in</small>'));
            var g2 = el('div', view === 'list' ? 'lrows' : 'grid');
            pieces.forEach(function (x) { x.kind = kindOf(x.slot); g2.appendChild(view === 'list' ? listRow(x) : card(x)); });
            main.appendChild(g2);
        }

        var h = el('h2', '', 'the world, twisted <small>swap any picture or sound on the site, from reset ' + n + ' on (a later reset can swap it again)</small>');
        main.appendChild(h);
        var add = el('div', 'swap-add');
        var inp = el('input'); inp.setAttribute('list', 'all-slots'); inp.placeholder = 'which one? e.g. assets/sky/sun';
        var dl = el('datalist'); dl.id = 'all-slots';
        allSlots().forEach(function (x) { if (!/^assets\/resets\//.test(x.slot)) { var o = document.createElement('option'); o.value = x.slot; o.label = x.what; dl.appendChild(o); } });
        add.appendChild(inp); add.appendChild(dl);
        add.appendChild(btn('choose its reset ' + n + ' version…', function () {
            var sl = inp.value.trim().replace(/\.[a-z0-9]+$/i, '');
            var m = /^assets\/([a-z0-9-]+)\/([a-z0-9-]+)$/.exec(sl);
            if (!m || m[1] === 'resets') return say('type (or pick) one of the site’s slots, like assets/sky/sun', true);
            var kind = kindOf(sl);
            pick(accept(kind), false, function (fs) { put('assets/resets/reset-' + n + '/' + m[1] + '/' + m[2], kind, fs[0]); });
        }, 'btn main'));
        main.appendChild(add);
        var mine = ((STATE.resets || {})[n] || []).filter(function (f) { return f.path.indexOf('/') !== -1 && f.path !== 'characters/reflection' && !/^characters\/reflection\./.test(f.path); });
        var box = el('div', view === 'list' ? 'lrows' : 'grid');
        if (!mine.length) main.appendChild(el('p', 'empty', 'nothing swapped in this reset yet.'));
        mine.forEach(function (f) {
            var base = 'assets/' + f.path.replace(/\.[^.\/]+$/, '');
            var x = { slot: 'assets/resets/reset-' + n + '/' + f.path.replace(/\.[^.\/]+$/, ''), what: base + ' from reset ' + n + ' on' + (whatOf(base) ? ' (' + whatOf(base) + ')' : ''), kind: kindOf(base) };
            box.appendChild(view === 'list' ? listRow(x) : card(x));
        });
        if (mine.length) main.appendChild(box);
        var carried = [];
        for (var r = n - 1; r >= 1; r--) ((STATE.resets || {})[r] || []).forEach(function (f) {
            if (f.path.indexOf('/') === -1) return;
            var stem = f.path.replace(/\.[^.\/]+$/, '');
            if (mine.some(function (m2) { return m2.path.replace(/\.[^.\/]+$/, '') === stem; }) || carried.some(function (c2) { return c2.stem === stem; })) return;
            carried.push({ stem: stem, from: r, f: f });
        });
        if (carried.length) {
            main.appendChild(el('h2', '', 'carried in from earlier resets'));
            var sh = el('div', 'sheet');
            carried.forEach(function (c2) {
                var row = el('div', 'row');
                row.appendChild(el('div', 'main', '<b>assets/' + esc(c2.stem) + '</b><span>reset ' + c2.from + '’s version (swap it here to change it again)</span>'));
                row.appendChild(btn('open', function () { window.open('/assets/resets/reset-' + c2.from + '/' + c2.f.path, '_blank'); }));
                sh.appendChild(row);
            });
            main.appendChild(sh);
        }
    }

    function draw() {
        drawTabs();
        main.innerHTML = '';
        var sc = SCENES.filter(function (s) { return s.id === tab; })[0];
        if (sc) drawScene(sc);
        else if (tab === 'records') drawRecords();
        else if (tab === 'noise') drawNoise();
        else if (tab === 'checklist') drawChecklist();
        else if (/^reset-[1-8]$/.test(tab) && window.DAV_RESETS) drawReset(+tab.slice(6));
        else { tab = SCENES[0].id; draw(); }
    }
    function load() {
        return api('/__assets/state').then(function (r) {
            if (r.error) { say(r.error, true); return; }
            STATE = r;
            buildScenes();
            var y = window.scrollY;
            draw();
            window.scrollTo(0, y);
        });
    }
    function headH() { document.documentElement.style.setProperty('--head-h', $('header').offsetHeight + 'px'); }
    headH();
    window.addEventListener('resize', headH);
    new ResizeObserver(headH).observe($('header'));
    $('.side-toggle').addEventListener('click', function () { document.body.classList.toggle('side-open'); });
    $('.publish').addEventListener('click', function () {
        api('/__letters/publish', {}).then(function (r) { say(r.error || 'publishing: a small window shows it going up and closes by itself when it\u2019s done. the live site updates a minute or two later.', !!r.error); });
    });
    fetch('slots.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (c) { CAT = c; load(); }, function () { say('couldn’t read tools/slots.json', true); });
})();
</script>
</body>
</html>
