<?xml version="1.0" encoding="UTF-8"?>
<!--
  PROP TEMPLATE · one piece per file (a lamp, a chair, a shelf, a sign …)

  Canvas is 1000 × 1000, but it doesn't have to stay square: resize the
  canvas to hug your drawing before exporting (Inkscape: Edit › Resize Page
  to Selection). Scale doesn't matter much in SVG; the site sizes it.

  Layers:
    00 guides   reference only, hide before exporting
    10 shape    the piece itself (flat fills, paper-cut style)
    20 details  lighter/darker cut-outs on top (grain, highlights, handles)
    30 glow     ONLY the parts that light up at dusk (flame, lampshade, windows)

  Colours: see palette.svg. Transparent background. Text → convert to paths.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1000" height="1000" viewBox="0 0 1000 1000">

  <g id="guides" inkscape:groupmode="layer" inkscape:label="00 guides (hide before export)" font-family="Georgia, serif" font-style="italic">
    <rect x="0" y="0" width="1000" height="1000" fill="none" stroke="#9a3b1f" stroke-width="2"/>
    <rect x="50" y="50" width="900" height="900" fill="none" stroke="#9a3b1f" stroke-width="1" stroke-dasharray="8 8"/>
    <line x1="500" y1="0" x2="500" y2="1000" stroke="#6e5236" stroke-width="1" stroke-dasharray="4 8"/>
    <line x1="0" y1="900" x2="1000" y2="900" stroke="#6e5236" stroke-width="2" stroke-dasharray="14 10"/>
    <text x="60" y="890" font-size="24" fill="#6e5236">baseline: where it touches the floor (or hangs from, if it's on a wall)</text>
    <text x="60" y="84" font-size="24" fill="#9a3b1f">keep a little margin for the drop-shadow</text>
    <!-- a ghost example so the scale reads: an armchair -->
    <g opacity=".12" fill="#3b2618">
      <path d="M290 460 C290 380 710 380 710 460 V720 H290 Z"/>
      <path d="M230 600 C230 540 320 540 320 600 V860 H230 Z M680 600 C680 540 770 540 770 600 V860 H680 Z"/>
      <rect x="290" y="700" width="420" height="110" rx="16"/>
      <rect x="260" y="850" width="480" height="34" rx="8"/>
      <rect x="280" y="880" width="22" height="20"/><rect x="698" y="880" width="22" height="20"/>
    </g>
  </g>

  <g id="shape"   inkscape:groupmode="layer" inkscape:label="10 shape"/>
  <g id="details" inkscape:groupmode="layer" inkscape:label="20 details"/>
  <g id="glow"    inkscape:groupmode="layer" inkscape:label="30 glow (lights up at dusk)"/>
</svg>
