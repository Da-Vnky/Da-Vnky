<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE OPHITE DIAGRAM · the dungeon floor (assets/living/dungeon-diagram)

  Draw it seen from STRAIGHT ABOVE, square, like this 1000 x 1000 page: the site
  squashes it flat onto the dungeon floor (so a circle here becomes a wide oval
  there). Keep the background see-through. Export as assets/living/dungeon-diagram
  (.svg or .png), and hide the guides layer first.

  The blue crosses (guides) are where the seven Claubes stand while they worship:
  the middles of the seven circles. Keep your circles there, or, if you move them,
  change SEATS in sky/claubes.js to match (each is x, y as a share of the page:
  x 500 on this page = 0.5).

  What's here (the drawing layer is the stand-in on the site, bigger):
    round the outside  Leviathan, the serpent with its tail in its mouth
    the seven circles  the seven Archons / spheres: saturn (at the back), jupiter,
                       mars, the sun, venus, mercury, the moon, joined by a 7-pointed star
    the middle         the lion-faced serpent (the Demiurge) with seven rays
-->
