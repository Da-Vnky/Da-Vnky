<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>the desk</title>
<!--
    the desk: the artist's own corner of the site, for writing letters, sorting the visitors' post, and
    putting up paintings from any browser, phone included. nothing links here, and nothing works without
    signing in: Supabase only lets the desk's owner change anything (tools/supabase-desk.sql).
    what's changed here shows on the site at once (sky.js: Sky.desk), and the next publish from the
    computer copies it all into the repo (tools/desk.py). see CLAUDE.md, "The desk".
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 30 C9 22 12 20 16 20 C20 20 23 22 23 30 Z' fill='%233a2716'/%3E%3Cpath d='M16 20 L27 3 L29 5 L18 21 Z' fill='%239a3b1f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="sky/paper.css">
<link rel="stylesheet" href="sky/css/embeds.css">
<link rel="stylesheet" href="sky/css/desk.css">
</head>
<body class="dk-out">
    <!-- the wood, the lamp's pool of light, a few drawn things on the desk -->
    <div class="dk-wood" aria-hidden="true"></div>
    <div class="dk-lamp" aria-hidden="true"></div>

    <header class="dk-head">
        <div class="dk-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64"><ellipse cx="32" cy="52" rx="17" ry="6" fill="#1b120b" opacity=".45"/>
                <path d="M18 50 C18 38 22 34 32 34 C42 34 46 38 46 50 Z" fill="#2b1d12" stroke="#6e5236" stroke-width="1.4"/>
                <ellipse cx="32" cy="35" rx="9" ry="3" fill="#120c07" stroke="#6e5236" stroke-width="1.2"/>
                <path d="M31 35 L52 4 C55 6 55 9 53 11 L34 36 Z" fill="#e9dbb8" stroke="#6e5236" stroke-width="1"/>
                <path d="M36 28 L50 8 M39 26 L52 10 M42 23 L53 12" stroke="#b89d6c" stroke-width=".8"/>
                <path d="M31 35 L33 37" stroke="#9a3b1f" stroke-width="2.4" stroke-linecap="round"/></svg>
        </div>
        <div class="dk-titles">
            <h1>the desk</h1>
            <p class="dk-who" hidden><span class="dk-email"></span> · <button type="button" class="dk-link dk-signout">sign out</button></p>
        </div>
        <a class="dk-link dk-site" href="index.html" target="_blank" rel="noopener">the site ↗</a>
    </header>

    <!-- signing in -->
    <section class="dk-signin" hidden>
        <form class="dk-sheet dk-signin-card" autocomplete="on">
            <div class="dk-seal" aria-hidden="true">
                <svg viewBox="0 0 80 80"><path d="M40 6 C52 4 60 12 68 16 C76 24 74 34 76 42 C78 54 68 62 62 68 C52 76 44 74 36 76 C24 76 16 68 10 60 C4 50 6 40 4 32 C6 20 14 14 22 10 C28 6 34 8 40 6 Z" fill="#9a3b1f"/>
                    <circle cx="40" cy="40" r="22" fill="none" stroke="#c4603a" stroke-width="2.4"/>
                    <path d="M28 52 L28 30 L40 44 L52 30 L52 52" fill="none" stroke="#5e1f0e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-6 40 40)"/></svg>
            </div>
            <h2>sign in at your desk</h2>
            <p class="dk-hint">only the desk's owner can change anything here.</p>
            <label>email<input type="email" name="email" class="dk-in-email" autocomplete="username" required></label>
            <label>password<input type="password" name="password" class="dk-in-pass" autocomplete="current-password" required></label>
            <button type="submit" class="dk-btn dk-main">sign in</button>
            <p class="dk-say" role="status"></p>
        </form>
    </section>

    <!-- signed in, but not (yet) the desk's owner: the one line that makes them so -->
    <section class="dk-claim" hidden>
        <div class="dk-sheet">
            <h2>one last step</h2>
            <p>you're signed in, but Supabase doesn't know this account is the desk's yet. on
               <a href="https://supabase.com/dashboard" target="_blank" rel="noopener">supabase.com</a>, open your project →
               <b>SQL Editor → New query</b>, paste this line and press <b>Run</b> (once):</p>
            <textarea class="dk-claim-sql" readonly rows="3"></textarea>
            <p><button type="button" class="dk-btn dk-claim-copy">copy it</button>
               <button type="button" class="dk-btn dk-main dk-claim-again">done: open the desk</button></p>
            <p class="dk-hint dk-claim-why"></p>
        </div>
    </section>

    <!-- the desk itself -->
    <nav class="dk-tabs" hidden>
        <button type="button" data-tab="letters" class="on">letters</button>
        <button type="button" data-tab="post">the post <span class="dk-count" hidden></span></button>
        <button type="button" data-tab="bottles">bottles</button>
        <button type="button" data-tab="paintings">paintings</button>
        <button type="button" data-tab="frames">frames</button>
    </nav>
    <p class="dk-waiting" hidden></p>
    <main class="dk-main-area" hidden>
        <section class="dk-pane" data-pane="letters"></section>
        <section class="dk-pane" data-pane="post" hidden></section>
        <section class="dk-pane" data-pane="bottles" hidden></section>
        <section class="dk-pane" data-pane="paintings" hidden></section>
        <section class="dk-pane" data-pane="frames" hidden></section>
    </main>

    <div class="dk-toast" role="status" aria-live="polite"></div>

    <script src="sky/embeds.js"></script>
    <script src="sky/hand.js"></script>
    <script src="sky/desk.js"></script>
</body>
</html>
