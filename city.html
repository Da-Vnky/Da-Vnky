<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>the city · DaV-nky</title>
    <link rel="canonical" href="https://dav-nky.pleroma.nexus/city.html">
    <meta property="og:title" content="the city · DaV-nky">
    <meta property="og:url" content="https://dav-nky.pleroma.nexus/city.html">
    <meta property="og:site_name" content="DaV-nky.pleroma.nexus">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="sky/sky.css?v=20260924k">
    <style>
        /* feet on the rooftop: 45% of the way up the roof strip (20vh tall, 17vh on phones) */
        .city-char { position: fixed; z-index: 3; right: 16vw; bottom: calc(max(20vh, 130px) * .45 - 2px); height: 17vh; min-height: 90px; }
        @media (max-width: 620px) { .city-char { bottom: calc(max(17vh, 110px) * .45 - 2px); height: 14vh; min-height: 70px; } }
    </style>
</head>
<body data-place="city">

    <!-- the telescope (an interface button, bottom-left): look across the lit skyline.
         the warm, glowing windows each hold a scene from content/city/ (one file = one window);
         click one to zoom right in. "look up at the sky" shows Polaris, the constellations and
         the day/night player.
         a custom icon can go in assets/city/telescope.(svg|png|webp|gif) -->
    <button class="ui-button telescope-btn" type="button" data-folder="content/city/">
        <span class="ui-icon" data-asset="assets/city/telescope">
            <svg class="placeholder" viewBox="0 0 32 32" aria-hidden="true" fill="currentColor">
                <g transform="rotate(-32 16 16)">
                    <rect x="3" y="13" width="22" height="6" rx="1.5"/>
                    <rect x="23" y="11.5" width="6" height="9" rx="1.5"/>
                    <rect x="1" y="14.2" width="3" height="3.6" rx=".8"/>
                </g>
                <path d="M15 19 L10 30 H12 L16 21 L20 30 H22 L17 19 Z"/>
            </svg>
        </span>
        <span>telescope</span>
    </button>

    <!-- the traveller, stargazing. your own: assets/characters/city.(gif|png|webp|svg) -->
    <!-- they stand on the rooftop (sky/ground-city.js draws it; your own: assets/city/foreground) -->
    <div class="character scene-character city-char" data-asset="assets/characters/city" data-say="clear skies tonight"
         aria-label="the traveller"></div>


    <script src="sky/sky.js?v=20260924k"></script>
    <script src="sky/ground-city.js?v=20260924k"></script>
    <script src="sky/peeper.js?v=20260924k"></script>
    <script src="sky/panel.js?v=20260924k"></script>
    <script src="sky/music.js?v=20260924k"></script>
    <script src="sky/weather.js?v=20260924k"></script>
    <script src="sky/noise.js?v=20260924k"></script>
</body>
</html>
