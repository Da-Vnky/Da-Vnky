<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<!-- "keeping a light on" — made by Claude (Anthropic) for Victor's living space, September 2026.
     a lighthouse keeps its lamp lit for the little ship heading home under Polaris,
     and a bottle with a message in it rides the swell. drawn in the site's own paper-cut colours. -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1128"/><stop offset=".45" stop-color="#18244a"/><stop offset=".72" stop-color="#3b3456"/><stop offset=".86" stop-color="#7a4a4a"/><stop offset="1" stop-color="#c47a4a"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffe7a8" stop-opacity=".75"/><stop offset=".55" stop-color="#ffd98a" stop-opacity=".22"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffd98a" stop-opacity=".0"/><stop offset=".25" stop-color="#ffd98a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#fff6d8" stop-opacity=".85"/><stop offset=".3" stop-color="#cfe0ff" stop-opacity=".25"/><stop offset="1" stop-color="#cfe0ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="lamp"><stop offset="0" stop-color="#fff8dc"/><stop offset=".4" stop-color="#ffd98a" stop-opacity=".8"/><stop offset="1" stop-color="#ffb050" stop-opacity="0"/></radialGradient>
  <radialGradient id="vignette" cx=".5" cy=".45" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
  <filter id="paper" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .09 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="-3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter>
</defs>

<rect width="800" height="1000" fill="url(#sky)"/>
<g fill="#f6ecd2"><circle cx="263" cy="87" r="0.9" opacity="0.49"/><circle cx="428" cy="197" r="0.9" opacity="0.90"/><circle cx="177" cy="54" r="1.6" opacity="0.48"/><circle cx="81" cy="227" r="2.0" opacity="0.51"/><circle cx="749" cy="304" r="1.6" opacity="0.47"/><circle cx="114" cy="224" r="2.0" opacity="0.51"/><circle cx="251" cy="426" r="1.1" opacity="0.50"/><circle cx="456" cy="106" r="0.9" opacity="0.72"/><circle cx="59" cy="40" r="1.1" opacity="0.70"/><circle cx="425" cy="406" r="1.6" opacity="0.74"/><circle cx="363" cy="163" r="1.1" opacity="0.80"/><circle cx="420" cy="456" r="1.6" opacity="0.59"/><circle cx="775" cy="70" r="1.6" opacity="0.53"/><circle cx="277" cy="486" r="1.6" opacity="0.47"/><circle cx="531" cy="400" r="2.0" opacity="0.84"/><circle cx="648" cy="183" r="1.3" opacity="0.75"/><circle cx="462" cy="243" r="0.9" opacity="0.92"/><circle cx="380" cy="349" r="0.9" opacity="0.82"/><circle cx="251" cy="305" r="1.6" opacity="0.59"/><circle cx="311" cy="351" r="0.9" opacity="0.92"/><circle cx="287" cy="322" r="1.6" opacity="0.48"/><circle cx="609" cy="76" r="1.1" opacity="0.65"/><circle cx="725" cy="263" r="1.1" opacity="0.67"/><circle cx="439" cy="461" r="1.6" opacity="0.88"/><circle cx="227" cy="222" r="1.3" opacity="0.79"/><circle cx="307" cy="128" r="0.9" opacity="0.54"/><circle cx="191" cy="129" r="1.6" opacity="0.87"/><circle cx="152" cy="154" r="1.1" opacity="0.66"/><circle cx="298" cy="299" r="1.1" opacity="0.80"/><circle cx="412" cy="325" r="0.9" opacity="0.68"/><circle cx="689" cy="495" r="2.0" opacity="0.65"/><circle cx="321" cy="63" r="1.6" opacity="0.48"/><circle cx="63" cy="116" r="1.1" opacity="0.50"/><circle cx="479" cy="62" r="2.0" opacity="0.53"/><circle cx="89" cy="195" r="0.9" opacity="0.49"/><circle cx="172" cy="202" r="1.3" opacity="0.93"/><circle cx="480" cy="252" r="0.9" opacity="0.87"/><circle cx="785" cy="248" r="1.6" opacity="0.61"/><circle cx="587" cy="254" r="1.1" opacity="0.71"/><circle cx="292" cy="362" r="0.9" opacity="0.83"/><circle cx="243" cy="338" r="0.9" opacity="0.80"/><circle cx="214" cy="197" r="1.1" opacity="0.63"/><circle cx="402" cy="335" r="2.0" opacity="0.86"/><circle cx="778" cy="445" r="1.1" opacity="0.86"/><circle cx="587" cy="126" r="2.0" opacity="0.70"/><circle cx="580" cy="515" r="1.3" opacity="0.69"/><circle cx="279" cy="422" r="1.3" opacity="0.93"/><circle cx="294" cy="122" r="1.1" opacity="0.69"/><circle cx="273" cy="256" r="2.0" opacity="0.87"/><circle cx="384" cy="343" r="0.9" opacity="0.87"/><circle cx="104" cy="208" r="1.1" opacity="0.69"/><circle cx="269" cy="418" r="1.6" opacity="0.68"/><circle cx="590" cy="53" r="1.1" opacity="0.54"/><circle cx="109" cy="87" r="1.6" opacity="0.85"/><circle cx="775" cy="345" r="1.3" opacity="0.53"/><circle cx="438" cy="21" r="0.9" opacity="0.71"/><circle cx="738" cy="231" r="1.1" opacity="0.86"/><circle cx="175" cy="138" r="1.3" opacity="0.70"/><circle cx="606" cy="176" r="2.0" opacity="0.66"/><circle cx="286" cy="244" r="2.0" opacity="0.86"/></g>

