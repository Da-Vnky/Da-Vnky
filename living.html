<html lang="en">

    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="sky/sky.css?v=20260926e">

    <style>
        /* ---------- this room's furniture (all paper-cut silhouettes) ---------- */
        .rug      { left: 14%; right: 26%; bottom: 3vh; height: 5vh; pointer-events: none; }
        .armchair { left: 12%; bottom: 4vh; width: 20%; max-width: 260px; }
        .lamp     { left: 3%;  bottom: 4vh; height: 56vh; }
        .shelf    { left: 44%; bottom: 0;  width: 26%; }
        .pinboard { left: 4%;  top: 11%;  width: 22%; }
        .letter-pile { left: 11%; top: calc(11% + 22vw * .75 + 24px); width: 13%; min-width: 120px; z-index: 3; filter: drop-shadow(0 4px 5px rgba(0,0,0,.35)); }
        .noise-machine { left: 63%; bottom: calc(26vw * 170 / 360 - 3px); width: 5.6vw; min-width: 64px; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
        .groove.cat   { left: 21%; bottom: calc(4vh + min(20vw, 260px) * .77 * .47); width: 5.5vw; min-width: 56px; z-index: 3; }
        .groove.plant { left: 83%; bottom: 3vh; width: 5.5vw; min-width: 58px; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
        .room .bottle-crate { left: 72%; bottom: 3vh; width: 8.5vw; min-width: 90px; aspect-ratio: 120 / 90; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }   /* (in front of the secret door) */
        .bottle-crate > .art { position: absolute; inset: 0; width: 100%; height: 100%; }

        .lamp .glow { opacity: calc(.2 + .8 * var(--dusk)); }
        .turntable { left: 47%; bottom: calc(26vw * 170 / 360 - 3px); width: 14vw; min-width: 150px; aspect-ratio: 200 / 110; z-index: 3;
                     filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }

        .claude-plaque { left: 27.9%; top: calc(52% + 6.8vw * 1.25 + 8px); width: 6%; padding: 3px 0 2px; text-align: center; font: italic bold clamp(9px, .75vw, 13px) "IM Fell English", Georgia, serif;
                         color: #4a2e06; text-shadow: 0 1px 0 rgba(255,244,200,.8), 0 -1px 0 rgba(90,55,5,.5);                       /* engraved */
                         background: linear-gradient(160deg, #7a5212 0%, #d9a93c 18%, #fff0b0 34%, #e8bd52 48%, #a8761e 64%, #f7dc8a 80%, #8a5a14 100%);
                         border-radius: 3px; box-shadow: inset 0 0 0 1px #fff3c0, inset 0 0 0 2px #8a5a14, 0 2px 5px rgba(0,0,0,.5); pointer-events: none; white-space: nowrap; overflow: visible; }
        /* a sparkle that twinkles across it, about once every 45 seconds */
        .claude-plaque::after { content: ""; position: absolute; left: 12%; top: -45%; width: 18px; height: 18px; pointer-events: none; opacity: 0;
                                background: radial-gradient(circle, #fff 0 12%, rgba(255,250,220,.9) 18%, transparent 55%),
                                            linear-gradient(0deg, transparent 46%, #fff 48% 52%, transparent 54%), linear-gradient(90deg, transparent 46%, #fff 48% 52%, transparent 54%);
                                filter: drop-shadow(0 0 3px #fff6c0); animation: plaque-twinkle 45s linear infinite; animation-delay: 6s; }
        .claude-plaque::before { content: ""; position: absolute; inset: 0; border-radius: 3px; pointer-events: none; opacity: 0;
                                 background: linear-gradient(110deg, transparent 30%, rgba(255,255,240,.85) 48%, transparent 66%) -150% 0 / 60% 100% no-repeat; animation: plaque-shine 45s linear infinite; animation-delay: 6s; }
        @keyframes plaque-twinkle { 0%, 1.2% { opacity: 0; transform: translateX(0) scale(.2) rotate(0deg); } 2% { opacity: 1; transform: translateX(120%) scale(1.15) rotate(45deg); }
                                    2.8% { opacity: 1; transform: translateX(260%) scale(.8) rotate(90deg); } 3.6%, 100% { opacity: 0; transform: translateX(340%) scale(.2) rotate(135deg); } }
        @keyframes plaque-shine { 0%, .8% { opacity: 1; background-position: -150% 0; } 3.4% { opacity: 1; background-position: 250% 0; } 3.5%, 100% { opacity: 0; background-position: 250% 0; } }
        @media (prefers-reduced-motion: reduce) { .claude-plaque::after, .claude-plaque::before { animation: none; } }

        /* the wallpaper stripe sits on top of the plank texture */
        .room { --wall: #3f5a55; --frame: #2a1d14; }
        .room::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(to right, transparent 0 46px, rgba(255, 240, 210, .05) 46px 60px);
            -webkit-mask:
                linear-gradient(#000 0 0),
                linear-gradient(#000 0 0) var(--wx, -999px) var(--wy, -999px) / var(--ww, 0) var(--wh, 0) no-repeat;
            -webkit-mask-composite: xor;
                    mask:
                linear-gradient(#000 0 0),
                linear-gradient(#000 0 0) var(--wx, -999px) var(--wy, -999px) / var(--ww, 0) var(--wh, 0) no-repeat;
                    mask-composite: exclude;
        }

        .pinned {
            left: 30%;
            top: 18%;
            width: 200px;
            padding: 16px 18px 14px;
            transform: rotate(2deg);
            background: #eadcb9;
            box-shadow: 0 6px 12px rgba(0,0,0,.35), inset 0 0 30px rgba(120,80,30,.25);
            font-size: 1rem;
            line-height: 1.4;
        }
        .pinned::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            width: 14px;
            height: 14px;
            margin-left: -7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #d86a4a, #7a2a18);
            box-shadow: 0 2px 3px rgba(0,0,0,.4);
        }
        .pinned h1 { margin: 0 0 6px; font: normal 1.4rem "IM Fell English SC", Georgia, serif; }
        .pinned p  { margin: 0; font-style: italic; color: var(--ink-faded); }

        /* ---------- the bathroom (through the arrow under the tabs; see sky/bathroom.js) ---------- */
        .bath-mirror { left: 41%; top: 13%; width: 13%; aspect-ratio: 3 / 4; z-index: 3; }
        .bath-sink   { left: 40.5%; bottom: 4vh; width: 14%; aspect-ratio: 140 / 200; }
        .bath-tub    { left: 62%; bottom: 3vh; width: 31%; aspect-ratio: 300 / 140; }
        .bath-towel  { left: 16%; top: 38%; width: 8%; aspect-ratio: 100 / 130; }
        .bath-shelf  { left: 26.5%; top: 24%; width: 11%; aspect-ratio: 140 / 70; }
        .bath-mat    { left: 36%; right: 42%; bottom: 2vh; height: 4vh; pointer-events: none; }
        .bath-character { left: 28%; bottom: 3vh; height: 25vh; }
        /* ---------- the hallway (the arrow on the left; see sky/bathroom.js) ---------- */
        .hall-door.to-workshop { left: 16%; bottom: calc(11vh - 12px); height: 58vh; aspect-ratio: 90 / 170; }
        .hall-door.to-roof     { left: 64%; bottom: calc(11vh - 12px); height: 58vh; aspect-ratio: 90 / 170; }
        .hall-lamp   { left: 46%; top: 0; width: 5%; min-width: 50px; }
        .hall-light  { top: 0; width: 3.4%; min-width: 34px; }
        .hall-light.l { left: 33.5%; } .hall-light.r { left: 62.8%; }
        .hall-cord   { left: 54%; top: 2.2vh; width: 1.8%; min-width: 18px; aspect-ratio: 20 / 200; }
        /* how the hallway looks before sky/attic.js arrives, so nothing shows and then jumps away as the page opens:
           the ladder's up, and it's the lamp in reset 4 and the cord and its two lights in any other (LAMP_RESETS in attic.js) */
        .hallway .hall-ladder { transform: translateY(-101%); visibility: hidden; }
        html:not([data-reset="4"]) .hallway .hall-lamp, html[data-reset="4"] .hallway .hall-cord, html[data-reset="4"] .hallway .hall-light { display: none; }
        .hall-runner { left: 8%; right: 8%; bottom: 3vh; height: 5vh; pointer-events: none; }
        .hall-hooks  { left: 37%; top: 30%; width: 10%; }
        .hall-character { left: 44%; bottom: 3vh; height: 25vh; }
        /* ---------- the dungeon (pull the loose book on the bookshelf; see sky/bathroom.js and sky/dungeon.js) ---------- */
        .shelf-book { left: calc(44% + 26vw * 106 / 360); bottom: calc(26vw * 90 / 360); width: calc(26vw * 15 / 360); min-width: 11px; aspect-ratio: 15 / 52; }
        .shelf-book.d1 { left: calc(44% + 26vw * 174 / 360); width: calc(26vw * 13 / 360); min-width: 10px; }
        .shelf-book.d2 { left: calc(44% + 26vw * 274 / 360); width: calc(26vw * 14 / 360); }
        .shelf-book.d3 { left: calc(44% + 26vw * 172 / 360); bottom: calc(26vw * 12 / 360); width: calc(26vw * 14 / 360); }
        .shelf-book.d4 { left: calc(44% + 26vw * 190 / 360); bottom: calc(26vw * 12 / 360); width: calc(26vw * 12 / 360); min-width: 9px; }
        .shelf-book.d5 { left: calc(44% + 26vw * 290 / 360); width: calc(26vw * 16 / 360); }
        .dungeon-diagram { left: 33%; bottom: 5vh; width: 34%; height: 13vh; }
        .dungeon-paper { left: 70%; bottom: 9vh; width: 4.6%; min-width: 46px; aspect-ratio: 100 / 70; }
        .dungeon-stairs { left: 0; bottom: calc(18vh - 4px); width: 21%; height: 72vh; z-index: 2; cursor: pointer; }
        .dungeon-chains { left: 76%; top: 0; width: 9%; height: 38vh; }
        .dungeon-chains.c2 { left: 27%; width: 6%; height: 28vh; }
        .dungeon-rack { left: 80%; bottom: calc(18vh - 6px); width: 16%; aspect-ratio: 160 / 120; }
        .candle { width: 2.1vw; min-width: 22px; aspect-ratio: 30 / 90; z-index: 3; }
        .candle.k1 { left: 49.1%; bottom: 15.6vh; }
        .candle.k2 { left: 62.4%; bottom: 12.8vh; width: 1.6vw; min-width: 17px; }
        .candle.k3 { left: 38.5%; top: 47%; }
        .candle.k4 { left: 59.5%; top: 47%; }
        .candle.k5 { left: 57.3%; bottom: 8.5vh; width: 1.8vw; min-width: 19px; }
        .candle.k6 { left: 40.9%; bottom: 8.5vh; width: 1.4vw; min-width: 15px; }
        .candle.k7 { left: 35.8%; bottom: 12.8vh; width: 1.5vw; min-width: 16px; }
        .dungeon .shame-plaque { left: 43.5%; top: 6%; width: 13%; z-index: 3; }
        .shame-plaque > svg, .shame-plaque > .art { display: block; width: 100%; height: auto; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
        .dungeon-character { left: 24%; bottom: 8vh; height: 25vh; }
        /* the toaster, on the floor by the plant: click it to take it (see sky/tub.js) */
        .secret-door { left: 79%; bottom: 3vh; width: 10.5%; height: 43vh; z-index: 2; overflow: hidden; cursor: default; }
        /* (it opens in the wall only: from the top of the floor up, the floor itself stays whole) */
        .secret-door { bottom: var(--floor-h, 9vh); height: calc(46vh - var(--floor-h, 9vh)); }
        .toaster { left: 89.5%; bottom: 2.6vh; width: 4.6vw; min-width: 52px; aspect-ratio: 100 / 70; z-index: 3; }

        @media (max-width: 620px) {
            .bath-mirror { left: 34%; top: 20%; width: 32%; }
            .bath-sink { left: 34%; width: 32%; }
            .bath-tub { left: 62%; width: 40%; }
            .bath-towel, .bath-shelf { display: none; }
            .dungeon .shame-plaque { left: 30%; top: 3%; width: 40%; }
            .shelf-book { left: 16%; top: calc(62% - 3.6vw * 52 / 15 + 2px); bottom: auto; width: 3.6vw; min-width: 13px; }
            .shelf-book.d1 { left: 11%; } .shelf-book.d2 { left: 19.8%; } .shelf-book.d3 { left: 23.6%; } .shelf-book.d4 { left: 7.4%; } .shelf-book.d5 { left: 27.4%; }
            .dungeon-diagram { left: 18%; width: 64%; } .dungeon-paper { left: 80%; width: 12%; min-width: 0; }
            .candle.k1 { left: 48%; } .candle.k2 { left: 64%; } .candle.k5 { left: 63%; } .candle.k6 { left: 32%; } .candle.k7 { left: 31%; }
            .dungeon-stairs { width: 34%; height: 46vh; }
            .dungeon-chains, .dungeon-rack, .candle.k3, .candle.k4 { display: none; }
            .candle.k1 { left: 36%; } .candle.k2 { left: 42%; }
            .dungeon-character { left: 50%; height: 14vh; }
            .gallery-frame[data-wall=shame] { top: 9% !important; width: 13% !important; }
            .gallery-frame[data-wall=shame][data-frame="1"] { left: 7% !important; }
            .gallery-frame[data-wall=shame][data-frame="2"] { left: 25% !important; }
            .gallery-frame[data-wall=shame][data-frame="3"] { left: 43% !important; }
            .gallery-frame[data-wall=shame][data-frame="4"] { left: 61% !important; }
            .gallery-frame[data-wall=shame][data-frame="5"] { left: 79% !important; }
            .dungeon .gallery-frame[data-wall=shame] { display: block; }
            .gallery-frame[data-wall=shame][data-frame="6"] { left: 34% !important; top: 25% !important; width: 32% !important; }
            .gallery-frame[data-wall=shame][data-frame="7"] { left: 72% !important; top: 27% !important; width: 16% !important; }
            .bath-mat { left: 28%; right: 30%; }
            .bath-character { left: 6%; height: 14vh; }
            .hall-door.to-workshop { left: 6%; height: 40vh; }
            .hall-door.to-roof { left: 56%; height: 40vh; }
            .hall-hooks { display: none; }
            .hall-character { left: 36%; height: 14vh; }
            .toaster { left: 44%; width: 11vw; min-width: 0; }
            .secret-door { left: 80%; width: 17%; height: calc(29vh - var(--floor-h, 9vh)); }
            .room .window { left: 12% !important; width: 76% !important; top: 34% !important; height: 28% !important; }
            .shelf, .lamp, .gallery-frame, .claude-plaque { display: none; }
            .pinned { left: 50%; top: 11%; width: 220px; margin-left: -110px; }
            .pinboard { left: 8%; top: 66%; width: 42%; border-width: 7px; }
            .letter-pile { left: 54%; top: 66%; width: 28%; min-width: 0; }
            .armchair { left: 20%; width: 34%; }
            .rug { left: 8%; right: 8%; }
            .room .character { left: 3% !important; height: 14vh !important; }
            .bottle-crate { left: 54%; width: 18vw; min-width: 0; }
            .groove.cat { left: 31%; bottom: calc(4vh + 34vw * .77 * .47); width: 11vw; min-width: 0; }
            .groove.plant { display: none; }
            .noise-machine { left: auto; right: 4%; bottom: auto; top: calc(62% + 14px - 15vw * 76 / 110); width: 15vw; min-width: 0; }
            body .pinboard .empty { font-size: 11px; padding: 6%; }
            .turntable { left: auto; right: 2%; bottom: 3vh; width: 26vw; min-width: 0; }
        }
    </style>
</head>
<body data-place="living">

    <!-- a room (see workshop.html for how rooms work and how the asset slots fill in). -->
    <div class="room" style="--lamp-x:8%; --lamp-y:40%">

        <a class="window" href="#outside" aria-label="look outside"
           style="left:46%; top:12%; width:28%; height:48%"></a>

        <div class="furnish pinned">
            <h1>the living space</h1>
            <p>put a record on, open a bottle from the crate. there's a garden out the window.</p>
        </div>

        <!-- the pinboard: every message from a bottle you've opened gets pinned here. click to read them all. -->
        <div class="furnish pinboard" data-asset="assets/living/pinboard"></div>

        <!-- the pile of letters on a little shelf under the board: bottles you've read and not pinned.
             anyone can flip through them. your own shelf: assets/living/letter-shelf; paper: assets/living/letter -->
        <div class="furnish letter-pile" data-asset="assets/living/letter-shelf"></div>

        <!-- the crate: approved bottles (files in content/living/bottles/) wait in here to be opened -->
        <div class="furnish bottle-crate" data-folder="content/living/bottles/" data-asset="assets/living/crate">
            <svg class="placeholder crate-art" viewBox="0 0 120 90" aria-hidden="true">
                <rect x="2" y="8" width="116" height="80" rx="3" fill="#6d4628"/>
                <g fill="#86583a"><rect x="6" y="12" width="108" height="20" rx="2"/><rect x="6" y="36" width="108" height="20" rx="2"/><rect x="6" y="60" width="108" height="24" rx="2"/></g>
                <g fill="#5a3a24"><rect x="6" y="12" width="10" height="72"/><rect x="104" y="12" width="10" height="72"/></g>
                <g fill="#2a1a10"><circle cx="11" cy="22" r="1.6"/><circle cx="109" cy="22" r="1.6"/><circle cx="11" cy="72" r="1.6"/><circle cx="109" cy="72" r="1.6"/></g>
                <text x="60" y="51" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#3b2618" opacity=".75">washed up</text>
            </svg>
        </div>

        <!-- picture frames: art from the visitors' portfolio, hung from the content manager (tools\content.bat).
             move one with left / top / width; its look with data-look (gilt, wood, dark, white, plain)
             or your own colours: --frame, --frame-w, --mat, --mat-w; tilt it with --tilt.
             your own frame art: assets/living/frame (all) or assets/living/frame-1, frame-2 … (see sky/frames.js).
             numbered from the largest (1) to the smallest (5).
             another frame: copy a line and give it the next number. they swing gently to the music. -->
        <div class="furnish gallery-frame" data-frame="1" data-look="gilt" style="left:76.5%; top:11%; width:9.5%"></div>
        <div class="furnish gallery-frame" data-frame="2" data-look="wood" style="left:78%; top:36%; width:7.5%; --tilt:.8deg"></div>
        <div class="furnish gallery-frame" data-frame="3" data-look="dark" style="left:35.5%; top:33.5%; width:6.5%; --tilt:-1.5deg"></div>
        <div class="furnish gallery-frame" data-frame="4" data-look="white" style="left:87.5%; top:14%; width:5.5%; aspect-ratio:1; --tilt:1.2deg"></div>
        <div class="furnish gallery-frame" data-frame="5" data-look="wood" style="left:88%; top:26%; width:4.5%; aspect-ratio:5 / 4; --tilt:-1deg"></div>

        <!-- floor lamp: glows brighter as evening comes -->
        <svg class="furnish lamp sways" data-asset="assets/living/lamp" viewBox="0 0 80 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <ellipse class="glow" cx="40" cy="70" rx="40" ry="46" fill="rgba(255,200,110,.3)"/>
            <path class="glow" d="M16 40 H64 L74 96 H6 Z" fill="#ffd98a"/>
            <path d="M14 36 H66 L76 98 H4 Z M18 42 L10 92 M62 42 L70 92" fill="none" stroke="#1f1610" stroke-width="3"/>
            <rect x="38" y="98" width="4" height="290" fill="#1f1610"/>
            <ellipse cx="40" cy="392" rx="26" ry="7" fill="#1f1610"/>
        </svg>

        <!-- rug -->
        <svg class="furnish rug" data-asset="assets/living/rug" viewBox="0 0 600 40" preserveAspectRatio="none" aria-hidden="true">
            <path d="M20 4 H580 L600 36 H0 Z" fill="#6e2f24"/>
            <path d="M44 10 H556 L570 30 H30 Z" fill="none" stroke="#d9b98a" stroke-width="2" opacity=".6"/>
        </svg>

        <!-- armchair -->
        <svg class="furnish armchair" data-asset="assets/living/armchair" viewBox="0 0 260 200" aria-hidden="true" style="filter: drop-shadow(0 -2px 8px rgba(0,0,0,.35))">
            <g fill="#1f1610">
                <path d="M40 40 C40 10 220 10 220 40 V120 H40 Z"/>
                <path d="M10 90 C10 70 50 70 50 90 V170 H10 Z M210 90 C210 70 250 70 250 90 V170 H210 Z"/>
                <rect x="40" y="118" width="180" height="46" rx="8"/>
                <rect x="20" y="160" width="220" height="16" rx="4"/>
                <rect x="30" y="176" width="10" height="24"/><rect x="220" y="176" width="10" height="24"/>
            </g>
        </svg>

        <!-- Claude's frame: a wall of its own (data-wall="claude"), not in the content manager's lists.
             what hangs in it: content/claude/frames.json. Victor gave this spot to Claude, September 2026. -->
        <div class="furnish gallery-frame claude-frame" data-wall="claude" data-frame="1" data-look="wood" style="left:27.5%; top:52%; width:6.8%; --tilt:1.2deg"></div>
        <div class="furnish claude-plaque" aria-hidden="true">Claude’s wall</div>

        <!-- bookshelf under the window -->
        <svg class="furnish shelf" data-asset="assets/living/bookshelf" viewBox="0 0 360 170" aria-hidden="true" style="filter: drop-shadow(0 -2px 8px rgba(0,0,0,.35))">
            <g fill="#1f1610">
                <rect x="0" y="0" width="360" height="12"/>
                <rect x="0" y="0" width="12" height="170"/><rect x="348" y="0" width="12" height="170"/>
                <rect x="0" y="80" width="360" height="10"/><rect x="0" y="158" width="360" height="12"/>
                <rect x="24" y="24" width="14" height="56"/><rect x="40" y="30" width="12" height="50"/><rect x="54" y="20" width="16" height="60"/>
                <path d="M74 80 L90 28 L102 32 L86 80 Z"/>
                <circle cx="150" cy="62" r="18"/><rect x="146" y="38" width="8" height="8"/>
                <rect x="210" y="40" width="60" height="40"/><rect x="290" y="26" width="12" height="54"/><rect x="304" y="34" width="14" height="46"/>
                <rect x="24" y="110" width="100" height="48"/><rect x="140" y="104" width="14" height="54"/><rect x="156" y="112" width="12" height="46"/>
                <path d="M250 158 C230 130 240 110 262 102 C284 110 294 130 274 158 Z"/>
            </g>
        </svg>

        <!-- a loose book on the bookshelf: pull it and the traveller goes down to the dungeon. your own: assets/living/shelf-book.
             the others are decoys (assets/living/shelf-decoy-1 … 4). each is a real book if you give it pages:
             pictures, short videos or PDFs in content/books/book-1 … book-4 (content manager -> your things -> the books).
