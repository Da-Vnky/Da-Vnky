<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>the living space · DaV-nky</title>
    <link rel="canonical" href="https://dav-nky.pleroma.nexus/living.html">
    <meta property="og:title" content="the living space · DaV-nky">
    <meta property="og:url" content="https://dav-nky.pleroma.nexus/living.html">
    <meta property="og:site_name" content="DaV-nky.pleroma.nexus">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="sky/sky.css?v=20260924g">

    <style>
        /* ---------- this room's furniture (all paper-cut silhouettes) ---------- */
        .rug      { left: 14%; right: 26%; bottom: 3vh; height: 5vh; pointer-events: none; }
        .armchair { left: 12%; bottom: 4vh; width: 20%; max-width: 260px; }
        .lamp     { left: 3%;  bottom: 4vh; height: 56vh; }
        .shelf    { left: 44%; bottom: 0;  width: 26%; }
        .pinboard { left: 4%;  top: 11%;  width: 22%; }
        .letter-pile { left: 11%; top: calc(11% + 22vw * .75 + 24px); width: 13%; min-width: 120px; z-index: 3; filter: drop-shadow(0 4px 5px rgba(0,0,0,.35)); }
        .noise-machine { left: 63%; bottom: calc(26vw * 170 / 360 - 3px); width: 5.6vw; min-width: 64px; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
        .groove.cat   { left: 21%; bottom: calc(4vh + min(20vw, 260px) * .77 * .47); width: 5.5vw; min-width: 56px; z-index: 3; }
        .groove.plant { left: 83%; bottom: 3vh; width: 5.5vw; min-width: 58px; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
        .bottle-crate { left: 72%; bottom: 3vh; width: 8.5vw; min-width: 90px; aspect-ratio: 120 / 90; z-index: 3; filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }
        .bottle-crate > .art { position: absolute; inset: 0; width: 100%; height: 100%; }

        .lamp .glow { opacity: calc(.2 + .8 * var(--dusk)); }
        .turntable { left: 47%; bottom: calc(26vw * 170 / 360 - 3px); width: 14vw; min-width: 150px; aspect-ratio: 200 / 110; z-index: 3;
                     filter: drop-shadow(0 4px 6px rgba(0,0,0,.4)); }

        /* the wallpaper stripe sits on top of the plank texture */
        .room { --wall: #3f5a55; --frame: #2a1d14; }
        .room::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(to right, transparent 0 46px, rgba(255, 240, 210, .05) 46px 60px);
            -webkit-mask:
                linear-gradient(#000 0 0),
                linear-gradient(#000 0 0) var(--wx, -999px) var(--wy, -999px) / var(--ww, 0) var(--wh, 0) no-repeat;
            -webkit-mask-composite: xor;
                    mask:
                linear-gradient(#000 0 0),
                linear-gradient(#000 0 0) var(--wx, -999px) var(--wy, -999px) / var(--ww, 0) var(--wh, 0) no-repeat;
                    mask-composite: exclude;
        }

        .pinned {
            left: 30%;
            top: 18%;
            width: 200px;
            padding: 16px 18px 14px;
            transform: rotate(2deg);
            background: #eadcb9;
            box-shadow: 0 6px 12px rgba(0,0,0,.35), inset 0 0 30px rgba(120,80,30,.25);
            font-size: 1rem;
            line-height: 1.4;
        }
        .pinned::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            width: 14px;
            height: 14px;
            margin-left: -7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #d86a4a, #7a2a18);
            box-shadow: 0 2px 3px rgba(0,0,0,.4);
        }
        .pinned h1 { margin: 0 0 6px; font: normal 1.4rem "IM Fell English SC", Georgia, serif; }
        .pinned p  { margin: 0; font-style: italic; color: var(--ink-faded); }

        @media (max-width: 620px) {
            .room .window { left: 12% !important; width: 76% !important; top: 34% !important; height: 28% !important; }
            .shelf, .lamp, .gallery-frame { display: none; }
            .pinned { left: 50%; top: 11%; width: 220px; margin-left: -110px; }
            .pinboard { left: 8%; top: 66%; width: 42%; border-width: 7px; }
            .letter-pile { left: 54%; top: 66%; width: 28%; min-width: 0; }
            .armchair { left: 20%; width: 34%; }
            .rug { left: 8%; right: 8%; }
            .room .character { left: 3% !important; height: 14vh !important; }
            .bottle-crate { left: 54%; width: 18vw; min-width: 0; }
            .groove.cat { left: 31%; bottom: calc(4vh + 34vw * .77 * .47); width: 11vw; min-width: 0; }
            .groove.plant { display: none; }
            .noise-machine { left: auto; right: 4%; bottom: auto; top: calc(62% + 14px - 15vw * 76 / 110); width: 15vw; min-width: 0; }
            body .pinboard .empty { font-size: 11px; padding: 6%; }
            .turntable { left: auto; right: 2%; bottom: 3vh; width: 26vw; min-width: 0; }
        }
    </style>
</head>
<body data-place="living">

    <!-- a room (see workshop.html for how rooms work and how the asset slots fill in). -->
    <div class="room" style="--lamp-x:8%; --lamp-y:40%">

        <a class="window" href="#outside" aria-label="look outside"
           style="left:46%; top:12%; width:28%; height:48%"></a>

        <div class="furnish pinned">
            <h1>the living space</h1>
            <p>put a record on, open a bottle from the crate. there's a garden out the window.</p>
        </div>

        <!-- the pinboard: every message from a bottle you've opened gets pinned here. click to read them all. -->
        <div class="furnish pinboard" data-asset="assets/living/pinboard"></div>

        <!-- the pile of letters on a little shelf under the board: bottles you've read and not pinned.
             anyone can flip through them. your own shelf: assets/living/letter-shelf; paper: assets/living/letter -->
        <div class="furnish letter-pile" data-asset="assets/living/letter-shelf"></div>

        <!-- the crate: approved bottles (files in content/living/bottles/) wait in here to be opened -->
        <div class="furnish bottle-crate" data-folder="content/living/bottles/" data-asset="assets/living/crate">
            <svg class="placeholder crate-art" viewBox="0 0 120 90" aria-hidden="true">
                <rect x="2" y="8" width="116" height="80" rx="3" fill="#6d4628"/>
                <g fill="#86583a"><rect x="6" y="12" width="108" height="20" rx="2"/><rect x="6" y="36" width="108" height="20" rx="2"/><rect x="6" y="60" width="108" height="24" rx="2"/></g>
                <g fill="#5a3a24"><rect x="6" y="12" width="10" height="72"/><rect x="104" y="12" width="10" height="72"/></g>
                <g fill="#2a1a10"><circle cx="11" cy="22" r="1.6"/><circle cx="109" cy="22" r="1.6"/><circle cx="11" cy="72" r="1.6"/><circle cx="109" cy="72" r="1.6"/></g>
                <text x="60" y="51" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#3b2618" opacity=".75">washed up</text>
            </svg>
        </div>

        <!-- picture frames: art from the visitors' portfolio, hung from the content manager (tools\content.bat).
             move one with left / top / width; its look with data-look (gilt, wood, dark, white, plain)
             or your own colours: --frame, --frame-w, --mat, --mat-w; tilt it with --tilt.
             your own frame art: assets/living/frame (all) or assets/living/frame-1, frame-2 … (see sky/frames.js).
             another frame: copy a line and give it the next number. -->
        <div class="furnish gallery-frame" data-frame="1" data-look="dark" style="left:33%; top:40%; width:6.5%; --tilt:-1.5deg"></div>
        <div class="furnish gallery-frame" data-frame="2" data-look="gilt" style="left:77%; top:13%; width:8.5%"></div>
        <div class="furnish gallery-frame" data-frame="3" data-look="wood" style="left:79%; top:43%; width:5.5%; aspect-ratio:1; --tilt:1deg"></div>

        <!-- floor lamp: glows brighter as evening comes -->
        <svg class="furnish lamp sways" data-asset="assets/living/lamp" viewBox="0 0 80 400" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
            <ellipse class="glow" cx="40" cy="70" rx="40" ry="46" fill="rgba(255,200,110,.3)"/>
            <path class="glow" d="M16 40 H64 L74 96 H6 Z" fill="#ffd98a"/>
            <path d="M14 36 H66 L76 98 H4 Z M18 42 L10 92 M62 42 L70 92" fill="none" stroke="#1f1610" stroke-width="3"/>
            <rect x="38" y="98" width="4" height="290" fill="#1f1610"/>
            <ellipse cx="40" cy="392" rx="26" ry="7" fill="#1f1610"/>
        </svg>

        <!-- rug -->
        <svg class="furnish rug" data-asset="assets/living/rug" viewBox="0 0 600 40" preserveAspectRatio="none" aria-hidden="true">
            <path d="M20 4 H580 L600 36 H0 Z" fill="#6e2f24"/>
            <path d="M44 10 H556 L570 30 H30 Z" fill="none" stroke="#d9b98a" stroke-width="2" opacity=".6"/>
        </svg>

        <!-- armchair -->
        <svg class="furnish armchair" data-asset="assets/living/armchair" viewBox="0 0 260 200" aria-hidden="true" style="filter: drop-shadow(0 -2px 8px rgba(0,0,0,.35))">
            <g fill="#1f1610">
                <path d="M40 40 C40 10 220 10 220 40 V120 H40 Z"/>
                <path d="M10 90 C10 70 50 70 50 90 V170 H10 Z M210 90 C210 70 250 70 250 90 V170 H210 Z"/>
                <rect x="40" y="118" width="180" height="46" rx="8"/>
                <rect x="20" y="160" width="220" height="16" rx="4"/>
                <rect x="30" y="176" width="10" height="24"/><rect x="220" y="176" width="10" height="24"/>
            </g>
        </svg>

        <!-- bookshelf under the window -->
        <svg class="furnish shelf" data-asset="assets/living/bookshelf" viewBox="0 0 360 170" aria-hidden="true" style="filter: drop-shadow(0 -2px 8px rgba(0,0,0,.35))">
            <g fill="#1f1610">
                <rect x="0" y="0" width="360" height="12"/>
                <rect x="0" y="0" width="12" height="170"/><rect x="348" y="0" width="12" height="170"/>
                <rect x="0" y="80" width="360" height="10"/><rect x="0" y="158" width="360" height="12"/>
                <rect x="24" y="24" width="14" height="56"/><rect x="40" y="30" width="12" height="50"/><rect x="54" y="20" width="16" height="60"/>
                <path d="M74 80 L90 28 L102 32 L86 80 Z"/>
                <circle cx="150" cy="62" r="18"/><rect x="146" y="38" width="8" height="8"/>
                <rect x="210" y="40" width="60" height="40"/><rect x="290" y="26" width="12" height="54"/><rect x="304" y="34" width="14" height="46"/>
                <rect x="24" y="110" width="100" height="48"/><rect x="140" y="104" width="14" height="54"/><rect x="156" y="112" width="12" height="46"/>
                <path d="M250 158 C230 130 240 110 262 102 C284 110 294 130 274 158 Z"/>
            </g>
        </svg>

        <!-- the record player: every .mp3 in content/living/ is a record in its crate.
             custom art: assets/living/turntable (and turntable-playing, shown while music plays;
             a GIF there can spin). without them, this drawing spins by itself. -->
        <div class="furnish turntable" data-folder="content/living/" data-asset="assets/living/turntable">
            <svg class="placeholder tt-art" viewBox="0 0 200 110" aria-hidden="true">
                <rect x="4" y="58" width="192" height="46" rx="4" fill="#5a3a24"/>
                <rect x="4" y="58" width="192" height="8" rx="3" fill="#7a5132"/>
                <rect x="4" y="96" width="192" height="8" rx="2" fill="#3b2618"/>
                <circle cx="170" cy="82" r="5" fill="#c49a52"/><circle cx="152" cy="82" r="5" fill="#c49a52"/>
                <rect x="14" y="104" width="12" height="6" fill="#2a1a10"/><rect x="174" y="104" width="12" height="6" fill="#2a1a10"/>
                <g transform="translate(80 58) scale(1 .3)">
                    <circle r="60" fill="#2a1a10"/>
                    <g class="tt-disc">
                        <circle r="54" fill="#141416"/>
                        <circle r="44" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
                        <circle r="34" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
                        <circle class="tt-label" r="18" fill="#9a3b1f"/>
                        <rect x="-3" y="-18" width="6" height="12" fill="rgba(255,255,255,.55)"/>
                        <path d="M-40 -30 A50 50 0 0 1 10 -50" stroke="rgba(255,255,255,.25)" stroke-width="6" fill="none"/>
                    </g>
                </g>
                <g class="tt-arm">
                    <circle cx="166" cy="24" r="7" fill="#c49a52"/>
                    <path d="M166 24 L160 50 L150 56" stroke="#d8c08a" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="143" y="52" width="10" height="6" rx="1.5" fill="#3a2716" transform="rotate(-20 148 55)"/>
                    <rect x="164" y="30" width="4" height="30" fill="#8a6a30"/>
                </g>
            </svg>
        </div>

        <!-- they dance when a record's on. your own: assets/living/cat, assets/living/plant
             (+ cat-dancing.gif etc. to replace the moves). see assets/README.txt -->
        <!-- the white noise machine: click it to mix rain, sea, fire … (sky/noise.js). your own: assets/living/noise-machine (+ noise-machine-on) -->
        <div class="furnish noise-machine" data-asset="assets/living/noise-machine"></div>
        <div class="furnish groove cat" data-groove="cat" data-asset="assets/living/cat"></div>
        <div class="furnish groove plant" data-groove="plant" data-asset="assets/living/plant"></div>

        <!-- the traveller, at home. your own: assets/characters/living.(gif|png|webp|svg) -->
        <div class="furnish character scene-character" data-asset="assets/characters/living"
             data-say="make yourself at home" aria-label="the traveller"
             style="left: 34%; bottom: 3vh; height: 25vh;"></div>
    </div>

    <script src="sky/sky.js?v=20260924g"></script>
    <!-- the view from this window is its own picture: assets/living/view (+ optional view-night) -->
    <script src="sky/ground-view.js?v=20260924g" data-view="assets/living/view"></script>
    <script src="sky/panel.js?v=20260924g"></script>
    <script src="sky/music.js?v=20260924g"></script>
    <script src="sky/weather.js?v=20260924g"></script>
    <script src="sky/noise.js?v=20260924g"></script>
    <script src="sky/records.js?v=20260924g"></script>
    <script src="sky/crate.js?v=20260924g"></script>
    <script src="sky/frames.js?v=20260924g"></script>
</body>
</html>
