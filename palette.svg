<?xml version="1.0" encoding="UTF-8"?>
<!-- the site's colours. eyedropper these, or type the hex codes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Georgia, serif">
  <rect width="1200" height="620" fill="#f3e8cc"/>
  <text x="40" y="56" font-size="34" fill="#3a2716">DaV-nky palette</text>

  <g font-size="14" fill="#3a2716">
    <text x="40" y="104" font-style="italic" fill="#6e5236">paper &amp; ink</text>
    <rect x="40"  y="116" width="120" height="80" fill="#e9dbb8"/><text x="40"  y="218">#e9dbb8 paper</text>
    <rect x="180" y="116" width="120" height="80" fill="#c9b082"/><text x="180" y="218">#c9b082 old edge</text>
    <rect x="320" y="116" width="120" height="80" fill="#3a2716"/><text x="320" y="218">#3a2716 ink</text>
    <rect x="460" y="116" width="120" height="80" fill="#6e5236"/><text x="460" y="218">#6e5236 faded ink</text>
    <rect x="600" y="116" width="120" height="80" fill="#9a3b1f"/><text x="600" y="218">#9a3b1f red chalk</text>
    <rect x="740" y="116" width="120" height="80" fill="#24170c"/><text x="740" y="218">#24170c ink blot</text>

    <text x="40" y="264" font-style="italic" fill="#6e5236">wood (workshop, dock, signs)</text>
    <rect x="40"  y="276" width="120" height="80" fill="#a4744a"/><text x="40"  y="378">#a4744a light</text>
    <rect x="180" y="276" width="120" height="80" fill="#86583a"/><text x="180" y="378">#86583a plank</text>
    <rect x="320" y="276" width="120" height="80" fill="#6e4e36"/><text x="320" y="378">#6e4e36 wall</text>
    <rect x="460" y="276" width="120" height="80" fill="#3b2618"/><text x="460" y="378">#3b2618 furniture</text>
    <rect x="600" y="276" width="120" height="80" fill="#2a1a10"/><text x="600" y="378">#2a1a10 iron</text>
    <rect x="740" y="276" width="120" height="80" fill="#3f5a55"/><text x="740" y="378">#3f5a55 living wall</text>
    <rect x="880" y="276" width="120" height="80" fill="#1f1610"/><text x="880" y="378">#1f1610 living furniture</text>

    <text x="40" y="424" font-style="italic" fill="#6e5236">sea, sky &amp; light</text>
    <rect x="40"  y="436" width="120" height="80" fill="#56636f"/><text x="40"  y="538">#56636f back wave</text>
    <rect x="180" y="436" width="120" height="80" fill="#28323b"/><text x="180" y="538">#28323b front wave</text>
    <rect x="320" y="436" width="120" height="80" fill="#e2d9c6"/><text x="320" y="538">#e2d9c6 foam</text>
    <rect x="460" y="436" width="120" height="80" fill="#5fa8dc"/><text x="460" y="538">#5fa8dc noon sky</text>
    <rect x="600" y="436" width="120" height="80" fill="#e8935a"/><text x="600" y="538">#e8935a sunset</text>
    <rect x="740" y="436" width="120" height="80" fill="#0b1022"/><text x="740" y="538">#0b1022 midnight</text>
    <rect x="880" y="436" width="120" height="80" fill="#ffd98a"/><text x="880" y="538">#ffd98a lamplight</text>
    <rect x="1020" y="436" width="120" height="80" fill="#fff6dc"/><text x="1020" y="538">#fff6dc starlight</text>
  </g>
  <text x="40" y="590" font-size="17" font-style="italic" fill="#6e5236">style: flat paper-cut shapes, soft drop-shadows, no outlines needed</text>
</svg>
