<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>the workshop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="sky/sky.css">

    <style>
        /* ---------- this room's furniture (all paper-cut silhouettes) ---------- */
        .bench   { left: 4%;  right: 4%; bottom: 0; height: 30vh; }
        .shelf   { left: 6%;  top: 40%; width: 30%; }
        .lantern { left: 26%; top: 0;   width: 60px; }
        .tools   { right: 4%; top: 18%; width: 11%; }

        .lantern .glow { opacity: calc(.25 + .75 * var(--dusk)); }

        .pinned {
            left: 8%;
            top: 15%;
            width: 210px;
            padding: 18px 20px 16px;
            transform: rotate(-3deg);
            background: #eadcb9;
            box-shadow: 0 6px 12px rgba(0,0,0,.35), inset 0 0 30px rgba(120,80,30,.25);
            font-size: 1rem;
            line-height: 1.4;
        }
        .pinned::before {                       /* the pin */
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            width: 14px;
            height: 14px;
            margin-left: -7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #d86a4a, #7a2a18);
            box-shadow: 0 2px 3px rgba(0,0,0,.4);
        }
        .pinned h1 {
            margin: 0 0 6px;
            font: normal 1.5rem "IM Fell English SC", Georgia, serif;
        }
        .pinned p { margin: 0; font-style: italic; color: var(--ink-faded); }

        @media (max-width: 620px) {
            .room .window { left: 12% !important; width: 76% !important; top: 34% !important; height: 30% !important; }
            .shelf, .tools { display: none; }
            .pinned { left: 50%; top: 11%; width: 220px; margin-left: -110px; }
            .lantern { left: 6%; }
            .bench { height: 24vh; }
        }
    </style>
</head>
<body data-voyage="300">

    <!-- =====================================================================
         A ROOM
         .room is the wall. .window is cut out of it and shows the live sky
         (and this page's ground) behind. click the window to step outside;
         a "back inside" button brings you back.

         --wall / --frame set the colours. move the window with its
         left / top / width / height. anything with class="furnish" sits
         on the wall; position it however you like.
         --lamp-x / --lamp-y is where the warm evening glow on the wall centres.
         ===================================================================== -->
    <div class="room" style="--wall:#6e4e36; --frame:#3b2618; --lamp-x:28%; --lamp-y:18%">

        <a class="window" href="#outside" aria-label="look outside"
           style="left:50%; top:13%; width:32%; height:46%"></a>

        <div class="furnish pinned">
            <h1>the workshop</h1>
            <p>under construction. look out the window, or scroll to let the day go by.</p>
        </div>

        <!-- hanging lantern: glows brighter as evening comes -->
        <svg class="furnish lantern" viewBox="0 0 60 150" aria-hidden="true">
            <circle class="glow" cx="30" cy="112" r="30" fill="rgba(255,200,110,.35)"/>
            <rect x="29" y="0" width="2" height="72" fill="#2a1a10"/>
            <path d="M18 76 H42 L46 82 H14 Z" fill="#2a1a10"/>
            <rect class="glow" x="18" y="84" width="24" height="36" rx="3" fill="#ffd98a"/>
            <path d="M16 84 H44 V120 H16 Z M20 88 V116 M40 88 V116" fill="none" stroke="#2a1a10" stroke-width="3"/>
            <path d="M14 122 H46 L42 128 H18 Z" fill="#2a1a10"/>
        </svg>

        <!-- shelf with jars and a book -->
        <svg class="furnish shelf" viewBox="0 0 300 120" aria-hidden="true" style="filter: drop-shadow(0 6px 6px rgba(0,0,0,.35))">
            <g fill="#3b2618">
                <rect x="0" y="96" width="300" height="10"/>
                <path d="M20 106 L40 106 L28 120 Z M260 106 L280 106 L272 120 Z"/>
                <rect x="24" y="44" width="30" height="52" rx="6"/><rect x="28" y="36" width="22" height="10"/>
                <rect x="66" y="60" width="26" height="36" rx="5"/><rect x="70" y="52" width="18" height="10"/>
                <rect x="112" y="30" width="14" height="66"/><rect x="128" y="36" width="12" height="60"/><rect x="142" y="26" width="16" height="70"/>
                <path d="M162 96 L178 40 L190 44 L174 96 Z"/>
                <circle cx="228" cy="80" r="16"/><rect x="224" y="58" width="8" height="10"/>
            </g>
        </svg>

        <!-- pegboard of tools -->
        <svg class="furnish tools" viewBox="0 0 120 220" aria-hidden="true" style="filter: drop-shadow(0 6px 6px rgba(0,0,0,.35))">
            <g fill="#3b2618">
                <rect x="30" y="10" width="8" height="120"/><path d="M20 10 H48 V30 H20 Z"/>
                <rect x="70" y="20" width="10" height="70"/><path d="M58 90 H92 L88 118 H62 Z"/>
                <path d="M20 150 H100 V160 H92 L88 200 H32 L28 160 H20 Z"/>
            </g>
        </svg>

        <!-- workbench -->
        <svg class="furnish bench" viewBox="0 0 1000 220" preserveAspectRatio="none" aria-hidden="true" style="filter: drop-shadow(0 -4px 8px rgba(0,0,0,.35))">
            <g fill="#3b2618">
                <rect x="0" y="40" width="1000" height="26"/>
                <rect x="40" y="66" width="30" height="154"/><rect x="930" y="66" width="30" height="154"/>
                <rect x="70" y="150" width="860" height="14"/>
                <rect x="620" y="6" width="70" height="34"/><rect x="600" y="0" width="110" height="10"/>
                <rect x="180" y="18" width="120" height="22"/><path d="M300 22 L360 30 L300 36 Z"/>
                <circle cx="820" cy="26" r="14"/><rect x="812" y="0" width="16" height="14"/>
            </g>
        </svg>
    </div>

    <script src="sky/sky.js"></script>
    <script src="sky/ground-countryside.js"></script>
</body>
</html>
