<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>the workshop · DaV-nky</title>
    <link rel="canonical" href="https://dav-nky.pleroma.nexus/workshop.html">
    <meta property="og:title" content="the workshop · DaV-nky">
    <meta property="og:url" content="https://dav-nky.pleroma.nexus/workshop.html">
    <meta property="og:site_name" content="DaV-nky.pleroma.nexus">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="sky/sky.css?v=20260924g">

    <style>
        /* ---------- this room's furniture (all paper-cut silhouettes) ---------- */
        .bench   { left: 4%;  right: 4%; bottom: 0; height: 30vh; }
        .shelf   { left: 6%;  top: 40%; width: 30%; }
        .lantern { left: 26%; top: 0;   width: 60px; }
        .tools   { left: 37%; top: 15%; width: 8%; }
        .groove.manikin   { left: 44%; bottom: calc(30vh * .818 - 2px); height: 12vh; aspect-ratio: 50 / 110; z-index: 3; }
        .groove.manikin > * { height: 100%; width: auto; }
        .groove.metronome { left: 53%; bottom: calc(30vh * .818 - 2px); width: 2.6vw; min-width: 28px; z-index: 3; }

        .lantern .glow { opacity: calc(.25 + .75 * var(--dusk)); }
        .easel   { left: 13%; bottom: 1vh; height: 56vh; aspect-ratio: 62 / 100; z-index: 3; filter: drop-shadow(0 6px 8px rgba(0,0,0,.4)); }
        .easel > .art { position: absolute; inset: 0; width: 100%; height: 100%; }
        .portfolio { left: 70%; bottom: 0; height: 21vh; aspect-ratio: 125 / 100; z-index: 3; }

        .pinned {
            left: 8%;
            top: 15%;
            width: 210px;
            padding: 18px 20px 16px;
            transform: rotate(-3deg);
            background: #eadcb9;
            box-shadow: 0 6px 12px rgba(0,0,0,.35), inset 0 0 30px rgba(120,80,30,.25);
            font-size: 1rem;
            line-height: 1.4;
        }
        .pinned::before {                       /* the pin */
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            width: 14px;
            height: 14px;
            margin-left: -7px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #d86a4a, #7a2a18);
            box-shadow: 0 2px 3px rgba(0,0,0,.4);
        }
        .pinned h1 {
            margin: 0 0 6px;
            font: normal 1.5rem "IM Fell English SC", Georgia, serif;
        }
        .pinned p { margin: 0; font-style: italic; color: var(--ink-faded); }

        @media (max-width: 620px) {
            .room .window { left: 12% !important; width: 76% !important; top: 34% !important; height: 30% !important; }
            .shelf, .tools { display: none; }
            .pinned { left: 50%; top: 11%; width: 220px; margin-left: -110px; }
            .lantern { left: 6%; }
            .bench { height: 24vh; }
            .groove.manikin { left: 42%; bottom: calc(24vh * .818 - 2px); height: 9vh; }
            .groove.metronome { display: none; }
            .room .character { left: 64% !important; height: 20vh !important; }
            .easel { left: 8%; height: 38vh; }
            .portfolio { left: auto; right: 4%; height: 11vh; }
        }
    </style>
</head>
<body data-place="workshop">

    <!-- =====================================================================
         A ROOM
         .room is the wall. .window is cut out of it and shows the live sky
         (and this page's ground) behind. click the window to step outside;
         a "back inside" button brings you back.

         --wall / --frame set the colours. move the window with its
         left / top / width / height. anything with class="furnish" sits
         on the wall; position it however you like.
         --lamp-x / --lamp-y is where the warm evening glow on the wall centres.

         ASSETS: every drawn piece below has a data-asset slot. drop a file with
         that name into assets/workshop/ (svg, gif, webp or png) and it replaces
         the drawing. a matching -glow file (lantern-glow.png) fades in at dusk.
         ===================================================================== -->
    <div class="room" style="--wall:#6e4e36; --frame:#3b2618; --lamp-x:28%; --lamp-y:18%">

        <a class="window" href="#outside" aria-label="look outside"
           style="left:50%; top:13%; width:32%; height:46%"></a>

        <div class="furnish pinned">
            <h1>the workshop</h1>
            <p>paintings on the easel, and art left by visitors in the portfolio. leave some of your own.</p>
        </div>

        <!-- hanging lantern: glows brighter as evening comes -->
        <svg class="furnish lantern wobbles" data-asset="assets/workshop/lantern" viewBox="0 0 60 150" aria-hidden="true">
            <circle class="glow" cx="30" cy="112" r="30" fill="rgba(255,200,110,.35)"/>
            <rect x="29" y="0" width="2" height="72" fill="#2a1a10"/>
            <path d="M18 76 H42 L46 82 H14 Z" fill="#2a1a10"/>
            <rect class="glow" x="18" y="84" width="24" height="36" rx="3" fill="#ffd98a"/>
            <path d="M16 84 H44 V120 H16 Z M20 88 V116 M40 88 V116" fill="none" stroke="#2a1a10" stroke-width="3"/>
            <path d="M14 122 H46 L42 128 H18 Z" fill="#2a1a10"/>
        </svg>

        <!-- shelf with jars and a book -->
        <svg class="furnish shelf" data-asset="assets/workshop/shelf" viewBox="0 0 300 120" aria-hidden="true" style="filter: drop-shadow(0 6px 6px rgba(0,0,0,.35))">
            <g fill="#3b2618">
                <rect x="0" y="96" width="300" height="10"/>
                <path d="M20 106 L40 106 L28 120 Z M260 106 L280 106 L272 120 Z"/>
                <rect x="24" y="44" width="30" height="52" rx="6"/><rect x="28" y="36" width="22" height="10"/>
                <rect x="66" y="60" width="26" height="36" rx="5"/><rect x="70" y="52" width="18" height="10"/>
                <rect x="112" y="30" width="14" height="66"/><rect x="128" y="36" width="12" height="60"/><rect x="142" y="26" width="16" height="70"/>
                <path d="M162 96 L178 40 L190 44 L174 96 Z"/>
                <circle cx="228" cy="80" r="16"/><rect x="224" y="58" width="8" height="10"/>
            </g>
        </svg>

        <!-- pegboard of tools -->
        <svg class="furnish tools" data-asset="assets/workshop/tools" viewBox="0 0 120 220" aria-hidden="true" style="filter: drop-shadow(0 6px 6px rgba(0,0,0,.35))">
            <g fill="#3b2618">
                <rect x="30" y="10" width="8" height="120"/><path d="M20 10 H48 V30 H20 Z"/>
                <rect x="70" y="20" width="10" height="70"/><path d="M58 90 H92 L88 118 H62 Z"/>
                <path d="M20 150 H100 V160 H92 L88 200 H32 L28 160 H20 Z"/>
            </g>
        </svg>

        <!-- workbench -->
        <svg class="furnish bench" data-asset="assets/workshop/bench" viewBox="0 0 1000 220" preserveAspectRatio="none" aria-hidden="true" style="filter: drop-shadow(0 -4px 8px rgba(0,0,0,.35))">
            <g fill="#3b2618">
                <rect x="0" y="40" width="1000" height="26"/>
                <rect x="40" y="66" width="30" height="154"/><rect x="930" y="66" width="30" height="154"/>
                <rect x="70" y="150" width="860" height="14"/>
                <rect x="620" y="6" width="70" height="34"/><rect x="600" y="0" width="110" height="10"/>
                <rect x="180" y="18" width="120" height="22"/><path d="M300 22 L360 30 L300 36 Z"/>
                <circle cx="820" cy="26" r="14"/><rect x="812" y="0" width="16" height="14"/>
            </g>
        </svg>

        <!-- the easel: your paintings and drawings from content/workshop/ (see content/README.txt).
             custom easel art: assets/workshop/easel.(svg|png|webp); keep its canvas in the
             same spot as this one (from 17% to 83% across, 6% to 56% down). -->
        <div class="furnish easel" data-folder="content/workshop/" data-asset="assets/workshop/easel">
            <svg class="placeholder easel-art" viewBox="0 0 62 100" preserveAspectRatio="none" aria-hidden="true">
                <g fill="#3b2618">
                    <path d="M29.5 0 H32.5 V98 H29.5 Z" opacity=".75"/>
                    <path d="M29 2 L32 2 L9 100 L5 100 Z"/>
                    <path d="M30 2 L33 2 L57 100 L53 100 Z"/>
                    <rect x="7" y="56" width="48" height="4" rx="1"/>
                    <rect x="9" y="60" width="44" height="1.6" opacity=".6"/>
                    <rect x="27" y="3" width="8" height="4" rx="1"/>
                </g>
            </svg>
        </div>

        <!-- the visitors' portfolio: art people leave with "leave some art" and you keep
             (save it into content/workshop/visitors/). your own: assets/workshop/portfolio -->
        <div class="furnish portfolio" data-visitors="content/workshop/visitors/" data-asset="assets/workshop/portfolio">
            <svg class="placeholder" viewBox="0 0 125 100" aria-hidden="true">
                <g transform="rotate(-4 62 60)">
                    <rect x="22" y="6" width="62" height="40" fill="#efe3c6" transform="rotate(-9 53 26)"/>
                    <path d="M30 22 q10 -10 20 -2 t22 -4" fill="none" stroke="#36526a" stroke-width="2.4" stroke-linecap="round" transform="rotate(-9 53 26)"/>
                    <rect x="44" y="4" width="56" height="40" fill="#f6ecd4" transform="rotate(7 72 24)"/>
                    <circle cx="62" cy="20" r="7" fill="#e8b33c" transform="rotate(7 72 24)"/>
                    <path d="M52 34 L66 24 L78 32 L90 22" fill="none" stroke="#6f8f4e" stroke-width="2.4" transform="rotate(7 72 24)"/>
                    <rect x="10" y="28" width="106" height="70" rx="4" fill="#5a3a24"/>
                    <rect x="10" y="28" width="106" height="9" rx="3" fill="#6e4a30"/>
                    <path d="M14 42 H112" stroke="#3b2618" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
                    <path d="M14 93 H112" stroke="#3b2618" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>
                    <rect x="38" y="54" width="50" height="20" rx="2" fill="#eadcb9"/>
                    <text x="63" y="68" text-anchor="middle" font-size="10" font-style="italic" font-family="Georgia, serif" fill="#3a2716">visitors</text>
                    <path d="M63 37 V50 M63 78 V98" stroke="#9a3b1f" stroke-width="2"/>
                    <path d="M63 78 q-8 8 -12 16 M63 78 q6 9 12 14" stroke="#9a3b1f" stroke-width="1.6" fill="none"/>
                </g>
            </svg>
        </div>

        <!-- they dance when music's playing. your own: assets/workshop/manikin, assets/workshop/metronome -->
        <div class="furnish groove manikin" data-groove="manikin" data-asset="assets/workshop/manikin"></div>
        <div class="furnish groove metronome" data-groove="metronome" data-asset="assets/workshop/metronome"></div>

        <!-- the traveller, at the bench. your own: assets/characters/workshop.(gif|png|webp|svg) -->
        <div class="furnish character scene-character" data-asset="assets/characters/workshop"
             data-say="mind the sawdust" aria-label="the traveller"
             style="left: 36%; bottom: 3vh; height: 27vh;"></div>
    </div>

    <script src="sky/sky.js?v=20260924g"></script>
    <script src="sky/ground-countryside.js?v=20260924g"></script>
    <script src="sky/gallery.js?v=20260924g"></script>
    <script src="sky/studio.js?v=20260924g"></script>
    <script src="sky/panel.js?v=20260924g"></script>
    <script src="sky/music.js?v=20260924g"></script>
    <script src="sky/weather.js?v=20260924g"></script>
    <script src="sky/noise.js?v=20260924g"></script>
</body>
</html>
